      <button class="btn small ${S.ws.mode === "select" ? "on" : ""}" data-ws-mode="select" title="Click a part of the design to select it">◎ Select</button>
      ${shaper ? `<button class="btn small ${S.ws.mode === "edit" ? "on" : ""}" data-ws-mode="edit" title="Click a text and type the new words">✎ Edit text</button>` : ""}
      <button class="btn small ${S.ws.mode === "off" ? "on" : ""}" data-ws-mode="off" title="Use the design as it is: switch views, open menus">☞ Click through</button>
      <span class="hint">${S.ws.mode === "select" ? "Click any part of the design to select it." : S.ws.mode === "edit" ? "Click a text, type the new words, press Enter." : "Use the design as it is; the notes stay pinned."}</span>`;
    renderWsSide(c, v, old);
    sendPins(c, v);
  }

  function renderWsSide(c, v, old) {
    const side = $("#ws-side");
    const t = $("#ws-text"), focused = document.activeElement === t, keep = t?.value || "", caret = t ? [t.selectionStart, t.selectionEnd] : null;
    const shaper = can("change");
    const sel = S.ws.selected;
    const notes = notesOf(c).filter((n) => n.anchor.variant === v.id);
    const busy = working(c).filter((k) => ["revise", "figma", "explore"].includes(k));
    side.innerHTML = `<div class="sel ${sel ? "" : "none"}">
        <div class="k">${S.ws.edit ? "Editing" : "Selected"}</div>
        <b>${esc(sel ? sel.label : "Nothing selected")}</b>
        ${sel ? "" : `<p class="hint">Click a part of the design. A note without a selection is about the whole option.</p>`}
      </div>
      ${S.ws.edit ? `<div class="edit">Text: “${esc(S.ws.edit.from)}” → “<b>${esc(S.ws.edit.to)}</b>”</div>` : ""}
      ${old ? "" : `<div class="composer" style="margin:0">
        <textarea id="ws-text" maxlength="4000" placeholder="${shaper ? (sel ? "What should change here? e.g. make it a secondary button" : "What should change in this option?") : "Your comment on this part…"}"></textarea>
        <div class="bar"><button class="btn primary" data-ws-send>${shaper ? "Send to Design Desk" : "Comment"}</button>${sel ? `<button class="btn small" data-ws-clear>Clear selection</button>` : ""}</div>
        ${shaper ? `<p class="hint">Design Desk changes the design and the new version appears here by itself. Notes sent in a row are done together.</p>` : ""}
      </div>`}
      ${busy.map((k) => `<div class="working"><span class="spin"></span><div>${esc(WORK[k])}</div></div>`).join("")}
      <div><h3 style="margin:0 0 8px">Notes on ${esc(v.name)}</h3>
        ${notes.length ? `<ol class="notes">${notes.map((th) => { const [st, label] = noteState(c, th); const last = th.messages[th.messages.length - 1]; return `<li class="note" data-ws-note="${esc(th.id)}" aria-current="${Boolean(sel?.selector) && sel.selector === th.anchor.selector}">
          <div class="h"><span class="n">#${th.n}</span><span>${esc(th.anchor.label || th.anchor.text || "the whole option")}</span><span class="chip ${st === "done" ? "ok" : st === "working" ? "warn" : ""}">${esc(label)}</span></div>
          <div>${esc(th.messages[0].text)}</div>${last?.by?.agent ? `<div class="a">${esc(last.text)}</div>` : ""}</li>`; }).join("")}</ol>` : `<p class="hint">No notes yet.</p>`}
      </div>`;
    const nt = $("#ws-text");
    if (nt) { nt.value = keep; if (focused) { nt.focus(); if (caret) nt.setSelectionRange(caret[0], caret[1]); } }
  }

  async function loadWsFrame(c, v, assetId) {
    const frame = $("#ws-frame");
    try {
      const a = await asset(assetId);
      if ($("#ws-frame") !== frame) return;
      frame.srcdoc = withScript(decode(a));
      frame.onload = () => {
        const old = assetId !== v.asset;
        frame.contentWindow?.postMessage({ type: "desk-mode", mode: old ? "off" : S.ws.mode }, "*");
        sendPins(S.card, v);
        if (S.ws.selected?.selector) frame.contentWindow?.postMessage({ type: "desk-select", selector: S.ws.selected.selector }, "*");
      };
    } catch (e) { frame.replaceWith(Object.assign(document.createElement("div"), { className: "panel", textContent: e instanceof Said ? e.message : "This option could not be loaded." })); }
  }
  function sendPins(c, v) {
    const pins = notesOf(c).filter((n) => n.anchor.variant === v.id && n.anchor.selector).map((n) => ({ n: n.n, selector: n.anchor.selector, state: noteState(c, n)[0] }));
    $("#ws-frame")?.contentWindow?.postMessage({ type: "desk-pins", pins }, "*");
  }
  const frameSay = (msg) => $("#ws-frame")?.contentWindow?.postMessage(msg, "*");

  addEventListener("message", (e) => {
    const frame = $("#ws-frame");
    if (!frame || e.source !== frame.contentWindow) return;
    const d = e.data || {};
    const pickOf = (text) => ({ selector: String(d.selector || "").slice(0, 500), text: String(text || "").slice(0, 120), tag: String(d.tag || "").slice(0, 40), label: String(d.label || "").slice(0, 120) });
    // In Edit text the frame keeps the focus: the person is typing into the design.
    if (d.type === "desk-picked") { S.ws.selected = pickOf(d.text); S.ws.edit = null; renderWorkspace(); if (S.ws.mode !== "edit") $("#ws-text")?.focus(); }
    if (d.type === "desk-edited") {
      S.ws.selected = pickOf(d.to); S.ws.edit = { from: String(d.from || ""), to: String(d.to || "") };
      renderWorkspace();
      const t = $("#ws-text"); if (t && !t.value.trim()) t.value = `Change the text “${S.ws.edit.from}” to “${S.ws.edit.to}”.`;
      t?.focus();
    }
  });

  // What the workspace shows; a refresh that changes none of it leaves it alone.
  function wsFingerprint(c) {
    const v = (c.variants || []).find((x) => x.id === S.variant);
    return JSON.stringify([v?.asset, v?.version, (c.waiting || []).map((w) => w.kind + w.state), notesOf(c).map((n) => [n.id, n.state, n.messages.length])]);
  }

  // ---------- rendering the detail ----------
  async function loadImages() {
    for (const img of document.querySelectorAll("img[data-asset]")) {
      if (img.src) continue;
      try { img.src = dataUrl(await asset(img.dataset.asset)); } catch {}
    }
    const spec = $("#spec-body");
    if (spec && S.card?.spec?.asset) { try { spec.innerHTML = md(decode(await asset(S.card.spec.asset))); } catch { spec.textContent = "The spec could not be loaded."; } }
    const vf = $("#variant-frame"), v = (S.card?.variants || []).find((x) => x.id === S.variant);
    if (vf && v) { try { vf.srcdoc = decode(await asset(v.asset)); } catch {} }
    const sf = $("#sheet-frame");
    if (sf && S.card?.sheet) { try { sf.srcdoc = decode(await asset(S.card.sheet)); } catch {} }
  }

  function renderDetail() {
    const d = $("#detail");
    $("#main").classList.toggle("has-detail", Boolean(S.card) || S.tab === "guide" || S.tab === "call");
    if (S.tab === "guide") { d.innerHTML = `<div class="guide">${GUIDE()}</div>`; return; }
    if (S.tab === "call" && !S.card) { renderAgendaDetail(); return; }
    if (S.tab === "product" && S.productFilter === "decisions") {
      d.innerHTML = S.decision ? renderDecision(S.decision) : `<div class="empty">Every decision the team made about the product, with where it was made. Pick one, or search.</div>`;
      $("#main").classList.toggle("has-detail", Boolean(S.decision));
      return;
    }
    if (!S.card) {
      const n = visibleCards().length;
      d.innerHTML = n ? `<div class="empty">Pick something on the left.</div>` : `<div class="empty">${S.cards.length ? "" : "The Desk is empty for now. "}<a href="#" data-tab="guide">How Design Desk works</a></div>`;
      return;
    }
    const keep = $("#composer-text")?.value || "";
    d.innerHTML = { change: renderChange, element: renderElement, screen: renderScreen, digest: renderDigest }[S.card.kind]?.(S.card) ?? renderRequest(S.card);
    if (keep && $("#composer-text")) $("#composer-text").value = keep;
    loadImages();
    if (S.card.kind === "screen") loadTimeline(S.card);
  }

  // ---------- loading ----------
  async function refreshList() {
    S.cards = (await api("GET", "/api/cards")).cards || [];
    try { S.agenda = (await api("GET", "/api/agenda")).agenda || []; } catch { S.agenda = []; }
    renderNav(); renderList();
  }
  async function openCard(id, { quiet = false } = {}) {
    const { card } = await api("GET", `/api/cards/${encodeURIComponent(id)}`);
    const before = S.card;
    if (before?.id !== card.id) { S.variant = null; S.ws = { ...S.ws, open: false, selected: null, edit: null, version: null }; }
    const changed = !before || before.id !== card.id || JSON.stringify(before) !== JSON.stringify(card);
    const wsChanged = S.ws.open && (!before || wsFingerprint(before) !== wsFingerprint(card));
    // A redraw arrived: say so and show the latest version.
    if (S.ws.open && before?.id === card.id) {
      const was = (before.variants || []).find((x) => x.id === S.variant), now = (card.variants || []).find((x) => x.id === S.variant);
      if (was && now && (now.version || 1) > (was.version || 1)) { toast(`${now.name} was updated to version ${now.version}.`); S.ws.version = null; }
    }
    S.card = card;
    if (!quiet || changed) {
      renderList();
      if (!(quiet && document.activeElement?.closest?.("#composer, .reply"))) renderDetail();
    }
    if (S.ws.open && (!quiet || wsChanged)) renderWorkspace();
  }

  // ---------- events ----------
  async function act(name) {
    const c = S.card;
    if (name === "workspace") { S.ws.open = true; S.ws.mode = can("change") || can("comment") ? "select" : "off"; renderWorkspace(); return; }
    if (name === "queue") {
      const r = await ask({ title: "Add to the next call", body: "The team looks at it at its next design meeting, and Design Desk writes a short brief of what to decide.", ok: "Add to the call", note: "What should the team decide? (optional)" });
      if (!r) return;
      await api("POST", `/api/cards/${c.id}/agenda`, { note: r.note });
      toast("Added to the next call. Design Desk will write a short brief.");
      await refreshList(); await openCard(c.id); return;
    }
    if (name === "unqueue") { await api("DELETE", `/api/cards/${c.id}/agenda`); await refreshList(); await openCard(c.id); return; }
    if (name === "clear-call") {
      const r = await ask({ title: "Is the call over?", body: "This clears the next-call list for everyone. Each item is marked as shown today.", ok: "Clear the list" });
      if (!r) return;
      await api("POST", "/api/calls", {}); await refreshList(); renderDetail(); return;
    }
    let note = "";
    const options = (c.variants || []).map((v) => ({ id: v.id, name: v.name, hint: tallyText(c, v.id) }));
    if (name === "approve") {
      const to = HANDOFF_TO[S.me?.handoff?.[c.request?.type || "idea"]] || HANDOFF_TO.desk;
      const fav = favourite(c);
      const r = await ask({ title: "Approve a design", body: `Design Desk writes the developer spec for the option you pick and sends it to ${to}. Once sent, it can't be taken back.`, ok: "Approve", choices: options.length ? options : null, pick: fav?.id || null });
      if (!r) return; note = r.choice || "";
    }
    if (name === "build") {
      const fav = favourite(c);
      const r = await ask({ title: "Build a live prototype", body: "Design Desk makes a private copy of the product with the option you pick, with made-up data, that everyone on the list can open. The first one can take up to an hour.", ok: "Build it", choices: options.length > 1 ? options : null, pick: fav?.id || options[0]?.id || null });
      if (!r) return; note = r.choice || options[0]?.id || "";
    }
    if (name === "close") {
      const r = await ask({ title: "Close this request?", body: "Design Desk stops working on it and switches off its live prototype. You can reopen it later.", ok: "Close it" });
      if (!r) return;
    }
    if (name === "slack-share") {
      const at = (days) => { const d = new Date(); d.setDate(d.getDate() + days); d.setHours(15, 0, 0, 0); return d.toISOString(); };
      const r = await ask({ title: "Share in Slack", body: "Design Desk posts these options to the team's Slack channel, one message per option with its picture. People vote with 👍 or ⚠️ and reply in each option's thread; the votes and replies come to this page, and the result is posted when the vote closes.",
        ok: "Post to Slack", choices: [{ id: String(at(1)), name: "Close tomorrow at 15:00" }, { id: String(at(3)), name: "Close in 3 days" }, { id: String(at(7)), name: "Close in a week" }], pick: String(at(3)), note: "What should people look at? (optional)" });
      if (!r) return;
      note = JSON.stringify({ closes: r.choice, note: r.note });
    }
    if (name === "figma-export") {
      const v = (c.variants || []).find((x) => x.id === S.variant);
      const r = await ask({ title: "Send to Figma", body: `Design Desk puts **${v?.name || "this option"}** into Figma as editable layers and links it here.`, ok: "Send" });
      if (!r) return; note = v?.id || "";
    }
    if (name === "figma-import") {
      const r = await ask({ title: "Import from Figma", body: "Paste a link to a frame in Figma (in Figma: right-click the frame → Copy link). Design Desk adds it as a design option and rebuilds it from the product's real parts.", ok: "Import", url: "Link to the Figma frame" });
      if (!r) return; note = r.url;
    }
    const res = await api("POST", `/api/cards/${c.id}/actions`, { action: name, note });
    if (res.inbox) toast(name === "close" ? "Closed." : "Sent. Design Desk is on it; this page updates by itself.");
    await refreshList(); await openCard(c.id);
  }
  function tallyText(c, id) {
    const votes = Object.values(c.votes?.[id] || {});
    const up = votes.filter((x) => x.vote === "prefer").length, down = votes.filter((x) => x.vote === "concern").length;
    return [up ? `👍 ${up}` : "", down ? `⚠ ${down}` : ""].filter(Boolean).join(" · ");
  }

  async function post(kind) {
    const text = $("#composer-text").value.trim(); if (!text) return;
    const r = await api("POST", `/api/cards/${S.card.id}/threads`, { kind, text });
    $("#composer-text").value = "";
    if (r.inbox) toast("Sent. Design Desk answers right here.");
    await openCard(S.card.id);
  }

  async function wsSend() {
    const c = S.card, v = wsVariant(c);
    const text = $("#ws-text")?.value.trim(); if (!text || !v) return;
    const sel = S.ws.selected;
    const anchor = { variant: v.id, ...(sel ? { selector: sel.selector, text: sel.text, tag: sel.tag, label: sel.label } : { label: "the whole option" }), ...(S.ws.edit ? { edit: S.ws.edit } : {}) };
    const kind = can("change") ? "change" : "comment";
    await api("POST", `/api/cards/${c.id}/threads`, { kind, text, anchor });
    $("#ws-text").value = ""; S.ws.edit = null;
    toast(kind === "change" ? "Sent. Design Desk is changing it; the design updates here by itself." : "Comment added.");
    await openCard(c.id);
  }

  document.addEventListener("click", guard(async (e) => {
    const el = e.target.closest("button, a[data-tab], [data-zoom], [data-ws-note]");
    if (!el) return;
    const ds = el.dataset;
    if (ds.tab) { e.preventDefault(); S.tab = ds.tab; S.card = null; S.ws.open = false; renderWorkspace(); renderNav(); renderList(); renderDetail(); if (ds.tab === "guide") store.set("desk-guide-seen", "1"); return; }
    if (ds.filter) { const [k, v] = ds.filter.split(":"); S[k] = v; S.card = null; S.decision = null; if (v === "decisions") await loadDecisions(); renderList(); renderDetail(); return; }
    if (ds.decision) { S.decision = S.decisions.find((x) => x.id === ds.decision) || null; renderList(); renderDetail(); return; }
    if (ds.card) { await openCard(ds.card); return; }
    if ("back" in ds) { S.card = null; S.decision = null; renderList(); renderDetail(); return; }
    if (ds.zoom) { const a = await asset(ds.zoom); const z = document.createElement("div"); z.className = "zoom"; z.innerHTML = `<img alt="" src="${dataUrl(a)}" />`; z.onclick = () => z.remove(); document.body.append(z); return; }
    if (ds.present !== undefined) { await present(Number(ds.present)); return; }
    if ("exitPresent" in ds) { $("#present")?.remove(); return; }
    if ("ack" in ds) { await api("POST", `/api/cards/${S.card.id}/ack`); await refreshList(); await openCard(S.card.id); return; }
    if ("focusComposer" in ds) { $("#composer-text")?.focus(); $("#composer")?.scrollIntoView({ block: "center" }); return; }
    if ("adjust" in ds) { openRequestDialog(S.card); return; }
    if ("addShots" in ds) { openShotsDialog(); return; }
    if (ds.post) { await post(ds.post); return; }
    if (ds.sendReply) {
      const input = document.querySelector(`[data-reply="${CSS.escape(ds.sendReply)}"]`); const text = input?.value.trim(); if (!text) return;
      const r = await api("POST", `/api/threads/${ds.sendReply}/messages`, { text });
      if (r.inbox) toast("Sent. Design Desk is on it.");
      await refreshList(); await openCard(S.card.id); return;
    }
    if (ds.resolve) { await api("POST", `/api/threads/${ds.resolve}/resolve`); await openCard(S.card.id); return; }
    if (ds.variant) { S.variant = ds.variant; renderDetail(); return; }
    if (ds.vote) {
      const mine = S.card.votes?.[S.variant]?.[myKey()]?.vote;
      const vote = mine === ds.vote ? "none" : ds.vote;
      await api("POST", `/api/cards/${S.card.id}/votes`, { variant: S.variant, vote });
      await openCard(S.card.id);
      if (vote === "concern") { const t = $("#composer-text"); t.value = `My concern about “${optionName(S.card, S.variant)}”: `; t.focus(); $("#composer").scrollIntoView({ block: "center" }); }
      return;
    }
    if (ds.goto) {
      const th = (S.card.threads || []).find((x) => x.id === ds.goto);
      if (!th?.anchor?.variant) return;
      S.variant = th.anchor.variant; S.ws.open = true; S.ws.version = null;
      S.ws.selected = th.anchor.selector ? { selector: th.anchor.selector, text: th.anchor.text || "", tag: th.anchor.tag || "", label: th.anchor.label || th.anchor.text || "an element" } : null;
      renderWorkspace(); return;
    }
    if (ds.act) { await act(ds.act); return; }
    // the workspace
    if ("wsClose" in ds) { S.ws.open = false; S.ws.selected = null; S.ws.edit = null; renderWorkspace(); renderDetail(); return; }
    if (ds.wsVariant) { S.variant = ds.wsVariant; S.ws.selected = null; S.ws.edit = null; S.ws.version = null; renderWorkspace(); return; }
    if (ds.wsMode) { S.ws.mode = ds.wsMode; renderWorkspace(); frameSay({ type: "desk-mode", mode: ds.wsMode }); return; }
    if ("wsSend" in ds) { await wsSend(); return; }
    if ("wsClear" in ds) { S.ws.selected = null; S.ws.edit = null; renderWorkspace(); frameSay({ type: "desk-select", selector: null }); return; }
    if (ds.wsNote) {
      const th = (S.card.threads || []).find((x) => x.id === ds.wsNote);
      if (!th?.anchor) return;
      S.ws.selected = th.anchor.selector ? { selector: th.anchor.selector, text: th.anchor.text || "", tag: th.anchor.tag || "", label: th.anchor.label || "an element" } : null;
      S.ws.edit = null;
      renderWorkspace();
      frameSay({ type: "desk-select", selector: th.anchor.selector || null });
      return;
    }
  }));

  let searchTimer = null;
  document.addEventListener("input", (e) => {
    if (e.target.id !== "decision-q") return;
    S.decisionQuery = e.target.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(async () => { await loadDecisions(); const pos = e.target.selectionStart; renderList(); const q = $("#decision-q"); if (q) { q.focus(); q.setSelectionRange(pos, pos); } }, 300);
  });

  document.addEventListener("change", (e) => {
    if (e.target.id === "ws-version") { const n = Number(e.target.value); S.ws.version = n === (wsVariant(S.card)?.version || 1) ? null : n; renderWorkspace(); }
  });

  document.addEventListener("keydown", (e) => {
    const ov = $("#present");
    if (ov && ["ArrowRight", "ArrowLeft", "Escape"].includes(e.key)) {
      if (e.key === "Escape") { ov.remove(); return; }
      present(Number(ov.dataset.index) + (e.key === "ArrowRight" ? 1 : -1)).catch(fail);
      return;
    }
    if (e.key === "Escape" && S.ws.open && !document.querySelector("dialog[open]")) { S.ws.open = false; renderWorkspace(); renderDetail(); return; }
    // Enter in a dialog's field would submit its form (docs/desk.md → Where it works): it presses the dialog's own button.
    if (e.key === "Enter" && !e.isComposing && e.target.matches("dialog input")) { e.preventDefault(); e.target.closest("dialog").querySelector("[data-close]:not([data-close=cancel])")?.click(); return; }
    if (e.key === "Enter" && !e.isComposing && !e.shiftKey && e.target.matches("[data-reply]")) { e.preventDefault(); document.querySelector(`[data-send-reply="${CSS.escape(e.target.dataset.reply)}"]`)?.click(); }
    if (e.key === "Enter" && !e.isComposing && (e.metaKey || e.ctrlKey) && e.target.id === "ws-text") { e.preventDefault(); $("[data-ws-send]")?.click(); }
  });

  // ---------- the request dialog ----------
  const pictures = [];
  function setType(type) {
    const f = $("#request-form");
    f.type.value = type;
    for (const b of document.querySelectorAll("#type-choice button")) b.setAttribute("aria-pressed", String(b.dataset.type === type));
    $("#rq-problem-label").textContent = type === "bug" ? "What's wrong, and where? What did you expect instead?" : "What would you change, and for whom?";
  }
  document.addEventListener("click", (e) => { const b = e.target.closest("#type-choice button"); if (b) setType(b.dataset.type); });

  // A picture is shrunk in the browser before it is sent: 1600 px wide at most, JPEG.
  async function addPicture(file, list = pictures, thumbs = "#rq-thumbs", max = 2) {
    if (list.length >= max || !/^image\//.test(file.type)) return;
    const img = await createImageBitmap(file);
    const scale = Math.min(1, 1600 / img.width);
    const canvas = Object.assign(document.createElement("canvas"), { width: Math.round(img.width * scale), height: Math.round(img.height * scale) });
    canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
    let q = 0.82, url = canvas.toDataURL("image/jpeg", q);
    while (url.length > 600 * 1024 && q > 0.4) { q -= 0.15; url = canvas.toDataURL("image/jpeg", q); }
    list.push({ contentType: "image/jpeg", data: url.split(",")[1], preview: url });
    $(thumbs).innerHTML = list.map((p) => `<img alt="" src="${p.preview}" />`).join("");
  }

  const added = [];
  const addShot = (f) => addPicture(f, added, "#sh-thumbs", 4);
  $("#sh-file").addEventListener("change", guard(async (e) => { for (const f of e.target.files) await addShot(f); e.target.value = ""; }));
  $("#shots-dialog").addEventListener("paste", guard(async (e) => { for (const it of e.clipboardData?.items || []) if (it.type.startsWith("image/")) { e.preventDefault(); await addShot(it.getAsFile()); } }));
  function openShotsDialog() { added.length = 0; $("#sh-thumbs").innerHTML = ""; $("#shots-dialog").returnValue = ""; $("#shots-dialog").showModal(); }
  $("#shots-dialog").addEventListener("close", guard(async (e) => {
    if (e.target.returnValue !== "send" || !added.length) return;
    await api("POST", `/api/cards/${S.card.id}/screens`, { images: added.map(({ contentType, data }) => ({ contentType, data })) });
    toast("Added. Design Desk checks them and writes their captions.");
    await openCard(S.card.id);
  }));
  $("#rq-file").addEventListener("change", guard(async (e) => { for (const f of e.target.files) await addPicture(f); e.target.value = ""; }));
  $("#request-dialog").addEventListener("paste", guard(async (e) => { for (const it of e.clipboardData?.items || []) if (it.type.startsWith("image/")) { e.preventDefault(); await addPicture(it.getAsFile()); } }));

  function openRequestDialog(from) {
    const dlg = $("#request-dialog"), f = $("#request-form");
    f.reset(); pictures.length = 0; $("#rq-thumbs").innerHTML = "";
    setType("idea");
    $("#type-choice").hidden = Boolean(from);
    $("#rq-figma").hidden = !S.me?.figma;
    $("#rq-title").textContent = from ? "Adjust this change" : "New request";
    $("#rq-hint").textContent = from
      ? "Tell Design Desk what should look different. It draws options; once a designer approves one, the coding agent builds it into the product."
      : "Describe it in your own words. Design Desk first tells you what can be done as a design change and what needs a developer.";
    if (from) $("#rq-problem-label").textContent = `What should look different in “${from.title}”?`;
    f.from.value = from ? from.id : "";
    dlg.returnValue = ""; dlg.showModal();
  }
  $("#new-request").addEventListener("click", () => openRequestDialog(null));

  // Day and night: the switch remembers a choice per browser; without one, the system's mode.
  const systemDark = matchMedia("(prefers-color-scheme: dark)");
  const isDark = () => (document.documentElement.dataset.theme || (systemDark.matches ? "dark" : "light")) === "dark";
  function renderTheme() {
    const b = $("#theme"), dark = isDark();
    b.textContent = dark ? "☀" : "☾";
    const label = dark ? "Switch to day mode" : "Switch to night mode";
    b.title = label; b.setAttribute("aria-label", label);
  }
  $("#theme").addEventListener("click", () => {
    const next = isDark() ? "light" : "dark";
    document.documentElement.dataset.theme = next; store.set("desk-theme", next); renderTheme();
  });
  systemDark.addEventListener("change", renderTheme);
  renderTheme();
  $("#request-dialog").addEventListener("close", guard(async (e) => {
    if (e.target.returnValue !== "send") return;
    const f = $("#request-form");
    const body = { type: f.type.value, problem: f.problem.value, screen: f.screen.value, ...(f.figma.value.trim() ? { figma: f.figma.value.trim() } : {}),
      ...(f.from.value ? { from: f.from.value } : {}), ...(pictures.length ? { images: pictures.map(({ contentType, data }) => ({ contentType, data })) } : {}) };
    const r = await api("POST", "/api/requests", body);
    toast("Sent. Design Desk first checks what can be done; this page updates by itself.");
    S.tab = "requests"; S.reqFilter = "open"; await refreshList(); await openCard(r.card.id);
  }));

  function applyMe() {
    $("#new-request").hidden = !can("request");
    $("#title").textContent = S.me?.name || "Design Desk";
    $("#me").textContent = S.me ? `${S.me.email || ""} · ${roleName(S.me.role)}` : "";
    renderBanners();
  }

  // One timer: every 15 s, every 4 s while the open request waits for Design Desk.
  let tick = 0;
  async function poll() {
    tick += 1;
    if (document.hidden) return;
    const fast = S.card && working(S.card).length > 0;
    if (!fast && tick % 4 !== 0) return;
    try {
      await refreshList();
      if (S.card) await openCard(S.card.id, { quiet: true });
      if (S.offline) { S.offline = false; renderBanners(); }
    } catch (e) {
      if (!(e instanceof Said) && !S.offline) { S.offline = true; renderBanners(); }
    }
  }

  async function start() {
    if (!bridge) { $("#detail").innerHTML = `<div class="panel">The Desk can't load here. Open it from the link your team shared with you, and bookmark that link.</div>`; $("#main").classList.add("has-detail"); return; }
    S.me = await api("GET", "/api/me");
    applyMe();
    await refreshList();
    // First visit, or an empty Desk: start with how it works.
    if (!store.get("desk-guide-seen") || !S.cards.length) { S.tab = "guide"; store.set("desk-guide-seen", "1"); }
    else if (!visibleCards().length && S.cards.some((c) => c.kind === "request" && !closed(c))) S.tab = "requests";
    renderNav(); renderList(); renderDetail();
    setInterval(() => { poll().catch(() => {}); }, 4000);
  }
  start().catch((e) => { $("#detail").innerHTML = `<div class="panel">${esc(e instanceof Said ? e.message : `Design Desk can't be reached right now. Try again in a minute; if it keeps happening, tell the Desk's owner.`)}</div>`; });
})();
</script>
</body>
</html>
