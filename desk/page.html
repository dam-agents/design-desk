<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Design Desk</title>
<script>
  // Before the first paint, so a chosen mode never flashes the other one.
  try { const t = localStorage.getItem("desk-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1b1b1a; --muted: #6b6b66; --line: #e4e3df; --soft: #f0efeb;
    --accent: #2f5bd3; --accent-ink: #ffffff; --ok: #1f7a4d; --ok-soft: #e3f3ea; --warn: #9a6200; --warn-soft: #fbf0d9;
    --bad: #b3261e; --bad-soft: #fbe5e3; --info-soft: #e7edfc; --radius: 10px; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04);
    --font: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  /* Night follows the system unless the header switch chose a mode (data-theme). */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #151514; --panel: #1e1e1c; --ink: #ecebe7; --muted: #a09f99; --line: #33332f; --soft: #262624;
      --accent: #8aa8ff; --accent-ink: #10142a; --ok: #6fd3a0; --ok-soft: #1c2f25; --warn: #f0c060; --warn-soft: #34291a;
      --bad: #ff8a80; --bad-soft: #3a1f1d; --info-soft: #1f2640; --shadow: none; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #151514; --panel: #1e1e1c; --ink: #ecebe7; --muted: #a09f99; --line: #33332f; --soft: #262624;
    --accent: #8aa8ff; --accent-ink: #10142a; --ok: #6fd3a0; --ok-soft: #1c2f25; --warn: #f0c060; --warn-soft: #34291a;
    --bad: #ff8a80; --bad-soft: #3a1f1d; --info-soft: #1f2640; --shadow: none; color-scheme: dark; }
  :root[data-theme="light"] { color-scheme: light; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); }
  button { font: inherit; color: inherit; }
  a { color: var(--accent); }
  .app { display: grid; grid-template-rows: auto auto 1fr; height: 100%; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .01em; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; }
  nav button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; cursor: pointer; color: var(--muted); }
  nav button[aria-current="true"] { background: var(--soft); color: var(--ink); font-weight: 600; }
  nav .count { display: inline-block; min-width: 18px; padding: 0 6px; margin-left: 6px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-size: 11px; line-height: 18px; text-align: center; }
  .grow { flex: 1; }
  .me { color: var(--muted); font-size: 12px; }
  .theme { width: 32px; height: 32px; padding: 0; justify-content: center; font-size: 15px; line-height: 1; }
  .banner { padding: 8px 20px; font-size: 13px; border-bottom: 1px solid var(--line); background: var(--info-soft); }
  .banner.warn { background: var(--warn-soft); }
  .btn { border: 1px solid var(--line); background: var(--panel); padding: 6px 12px; border-radius: 8px; cursor: pointer; text-decoration: none; color: inherit; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { background: var(--soft); }
  .btn.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  .btn.primary:hover { opacity: .9; }
  .btn.small { padding: 3px 9px; font-size: 12px; }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .btn.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  main { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; min-height: 0; }
  main.wide { grid-template-columns: 1fr; } main.wide .list { display: none; }
  .list { border-right: 1px solid var(--line); overflow: auto; padding: 12px; }
  .detail { overflow: auto; padding: 24px 32px 64px; }
  .row { display: block; width: 100%; text-align: left; border: 1px solid transparent; background: transparent; border-radius: var(--radius); padding: 10px 12px; cursor: pointer; margin-bottom: 4px; }
  .row:hover { background: var(--soft); }
  .row[aria-current="true"] { background: var(--panel); border-color: var(--line); box-shadow: var(--shadow); }
  .row .t { font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
  .row .t .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; transform: translateY(-1px); }
  .row .s { color: var(--muted); font-size: 12.5px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row .meta { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; background: var(--soft); color: var(--muted); white-space: nowrap; }
  .chip.ok { background: var(--ok-soft); color: var(--ok); } .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.bad { background: var(--bad-soft); color: var(--bad); } .chip.info { background: var(--info-soft); color: var(--accent); }
  .empty { color: var(--muted); padding: 24px 12px; text-align: center; max-width: 60ch; margin: 0 auto; }
  .filters { display: flex; gap: 6px; margin: 0 0 10px; flex-wrap: wrap; }
  h2 { font-size: 22px; line-height: 1.25; margin: 0 0 6px; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 10px; font-weight: 600; }
  .lead { font-size: 16px; margin: 10px 0 18px; max-width: 72ch; }
  .sub { color: var(--muted); font-size: 12.5px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .hint { color: var(--muted); font-size: 12.5px; margin: 4px 0 0; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 4px; align-items: center; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
  .section { margin: 0 0 14px; max-width: 76ch; }
  .section h4 { margin: 0 0 4px; font-size: 14.5px; }
  .md p { margin: 0 0 8px; } .md ul { margin: 0 0 8px; padding-left: 20px; } .md code { font-family: var(--mono); font-size: 12.5px; background: var(--soft); padding: 1px 4px; border-radius: 4px; }
  .shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .shot { margin: 0; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--panel); cursor: zoom-in; }
  .shot img { display: block; width: 100%; min-height: 120px; background: var(--soft); object-fit: cover; object-position: top; max-height: 260px; }
  .shot figcaption { padding: 6px 10px; font-size: 12px; color: var(--muted); }
  .zoom { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: grid; place-items: center; padding: 24px; z-index: 80; cursor: zoom-out; }
  .zoom img { max-width: 100%; max-height: 100%; border-radius: 6px; background: #fff; }
  .steps { display: flex; gap: 0; margin: 14px 0 6px; flex-wrap: wrap; }
  .step { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; padding: 4px 10px 4px 0; }
  .step::after { content: "›"; margin-left: 8px; opacity: .5; } .step:last-child::after { content: ""; }
  .step .n { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); font-size: 11px; }
  .step.done { color: var(--ink); } .step.done .n { background: var(--ok-soft); color: var(--ok); }
  .step.now { color: var(--ink); font-weight: 600; } .step.now .n { background: var(--ink); color: var(--panel); }
  .status { display: grid; gap: 10px; margin: 12px 0 8px; max-width: 80ch; }
  .working { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: var(--radius); background: var(--info-soft); }
  .spin { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); margin-top: 6px; flex: none; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .next { padding: 10px 14px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--panel); }
  .next b { display: block; margin-bottom: 2px; }
  .asks { padding: 12px 14px; border-radius: var(--radius); background: var(--warn-soft); }
  .asks .reply { border: 0; padding: 8px 0 0; }
  details.more { position: relative; display: inline-block; }
  details.more > summary { list-style: none; cursor: pointer; } details.more > summary::-webkit-details-marker { display: none; }
  details.more .menu { position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; min-width: 220px; display: grid; gap: 2px; padding: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  details.more .menu .btn { border: 0; justify-content: flex-start; width: 100%; }
  .verdict { border-radius: var(--radius); padding: 14px 16px; margin: 6px 0 4px; max-width: 80ch; }
  .verdict.design { background: var(--ok-soft); } .verdict.needs-developer { background: var(--warn-soft); } .verdict.product { background: var(--info-soft); }
  .verdict b { display: block; margin-bottom: 4px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
  .two ul { margin: 4px 0 0; padding-left: 18px; }
  details.fold > summary { cursor: pointer; color: var(--muted); font-size: 13px; margin: 18px 0 8px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .tabs button { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  .tabs button[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .frame { width: 100%; height: 66vh; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; display: block; }
  .vbar { display: flex; gap: 8px; align-items: center; margin: 10px 0; flex-wrap: wrap; }
  .tally { display: flex; gap: 6px; flex-wrap: wrap; }
  .threads { display: grid; gap: 10px; max-width: 80ch; }
  .thread { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
  .thread .head { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
  .anchor { font-size: 12px; background: var(--soft); padding: 1px 8px; border-radius: 999px; cursor: pointer; max-width: 46ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 0; }
  .msg { padding: 10px 12px; } .msg + .msg { border-top: 1px dashed var(--line); }
  .msg .who { font-size: 12px; color: var(--muted); margin-bottom: 3px; } .msg.agent { background: var(--soft); }
  .msg .who b { color: var(--ink); }
  .reply { display: flex; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--line); }
  textarea, input, select { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; width: 100%; }
  textarea { min-height: 64px; resize: vertical; }
  .composer { display: grid; gap: 8px; max-width: 80ch; margin-top: 10px; }
  .composer .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pending { color: var(--warn); font-size: 12px; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: 8px; z-index: 90; max-width: calc(100% - 32px); }
  dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(560px, calc(100% - 32px)); background: var(--panel); color: var(--ink); }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog form { padding: 20px; display: grid; gap: 10px; }
  dialog h2 { font-size: 18px; } label { font-size: 12.5px; color: var(--muted); display: grid; gap: 4px; }
  .drop { border: 1px dashed var(--line); border-radius: 8px; padding: 10px; font-size: 12.5px; color: var(--muted); display: grid; gap: 8px; }
  .thumbs { display: flex; gap: 8px; flex-wrap: wrap; } .thumbs img { height: 64px; border-radius: 6px; border: 1px solid var(--line); }
  .choices { display: grid; gap: 6px; } .choices label { display: flex; gap: 8px; align-items: center; color: var(--ink); font-size: 14px; } .choices input { width: auto; }
  .guide { max-width: 74ch; } .guide li { margin-bottom: 6px; } .guide ol { padding-left: 20px; }
  .proto { display: grid; gap: 8px; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 13px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; }
  .impact ul { margin: 4px 0 10px; padding-left: 20px; } .impact li { margin-bottom: 4px; }
  .back { display: none; }
  /* the design workspace */
  #workspace { position: fixed; inset: 0; z-index: 70; background: var(--bg); display: grid; grid-template-rows: auto 1fr; }
  #workspace[hidden] { display: none; }
  .ws-top { display: flex; gap: 10px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  .ws-top .title { font-weight: 600; max-width: 32ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ws-body { display: grid; grid-template-columns: 1fr 380px; min-height: 0; }
  .ws-stage { padding: 12px; display: grid; grid-template-rows: auto 1fr; gap: 8px; min-height: 0; }
  .ws-stage .frame { height: 100%; }
  .ws-side { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 16px; display: grid; gap: 14px; align-content: start; }
  .sel { padding: 10px 12px; border-radius: var(--radius); border: 2px solid var(--accent); background: var(--info-soft); }
  .sel.none { border-style: dashed; border-color: var(--line); background: transparent; }
  .sel .k { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .edit { font-size: 13px; padding: 6px 10px; border-radius: 8px; background: var(--soft); }
  .notes { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .note { border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; cursor: pointer; }
  .note[aria-current="true"] { border-color: var(--accent); }
  .note .h { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .note .n { font-weight: 700; color: var(--ink); }
  .note .a { font-size: 12.5px; background: var(--soft); border-radius: 6px; padding: 6px 8px; margin-top: 6px; }
  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; }
    main.has-detail .list { display: none; } main:not(.has-detail) .detail { display: none; }
    .detail { padding: 16px; } .back { display: inline-flex; margin-bottom: 10px; } .two { grid-template-columns: 1fr; }
    .ws-body { grid-template-columns: 1fr; grid-template-rows: 55vh auto; } .ws-side { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="title">Design Desk</h1>
    <nav id="nav"></nav>
    <div class="grow"></div>
    <span class="me" id="me"></span>
    <button class="btn theme" id="theme" type="button"></button>
    <button class="btn primary" id="new-request" hidden>+ New request</button>
  </header>
  <div class="banners" id="banners"></div>
  <main id="main">
    <section class="list" id="list" aria-label="List"></section>
    <section class="detail" id="detail"></section>
  </main>
</div>

<div id="workspace" hidden></div>

<dialog id="request-dialog">
  <form method="dialog" id="request-form">
    <h2 id="rq-title">New request</h2>
    <p class="sub" id="rq-hint"></p>
    <div class="tabs" role="radiogroup" id="type-choice">
      <button type="button" data-type="idea" aria-pressed="true">Suggest a change</button>
      <button type="button" data-type="bug" aria-pressed="false">Report something broken</button>
    </div>
    <input type="hidden" name="type" value="idea" />
    <label><span id="rq-problem-label">What would you change, and for whom?</span><textarea name="problem" maxlength="4000" required></textarea></label>
    <label><span>Which screen? (optional)</span><input name="screen" maxlength="500" placeholder="e.g. the agents list" /></label>
    <label id="rq-figma" hidden><span>Figma link (optional)</span><input name="figma" maxlength="500" placeholder="https://www.figma.com/design/…" /></label>
    <div class="drop" id="rq-drop">
      <span>Screenshot (optional): paste it here with Ctrl+V or ⌘V, or <label style="display:inline;color:var(--accent);cursor:pointer">choose a file<input type="file" accept="image/png,image/jpeg,image/webp" id="rq-file" hidden multiple /></label>. Two at most.</span>
      <div class="thumbs" id="rq-thumbs"></div>
    </div>
    <input type="hidden" name="from" />
    <div class="actions"><button type="button" class="btn primary" data-close="send">Send</button><button type="button" class="btn" data-close="cancel">Cancel</button></div>
  </form>
</dialog>

<dialog id="shots-dialog">
  <form method="dialog" id="shots-form">
    <h2>Add screenshots</h2>
    <p class="sub" id="sh-hint">Take them in the product and paste them here. Design Desk checks that each one shows the change, and writes its caption.</p>
    <div class="drop">
      <span>Paste with Ctrl+V or ⌘V, or <label style="display:inline;color:var(--accent);cursor:pointer">choose files<input type="file" accept="image/png,image/jpeg,image/webp" id="sh-file" hidden multiple /></label>. Four at most.</span>
      <div class="thumbs" id="sh-thumbs"></div>
    </div>
    <div class="actions"><button type="button" class="btn primary" data-close="send">Add</button><button type="button" class="btn" data-close="cancel">Cancel</button></div>
  </form>
</dialog>

<dialog id="confirm-dialog">
  <form method="dialog" id="confirm-form">
    <h2 id="cf-title"></h2>
    <div id="cf-body" class="md"></div>
    <div id="cf-choices" class="choices"></div>
    <label id="cf-note-wrap" hidden><span id="cf-note-label"></span><textarea name="note" maxlength="500"></textarea></label>
    <label id="cf-url-wrap" hidden><span id="cf-url-label"></span><input name="url" maxlength="500" /></label>
    <div class="actions"><button type="button" class="btn primary" data-close="ok" id="cf-ok"></button><button type="button" class="btn" data-close="cancel">Cancel</button></div>
  </form>
</dialog>

<script>
(() => {
  "use strict";
  // ---------- words people read ----------
  const ROLE = { lead: "lead", designer: "designer", pm: "PM", developer: "developer", guest: "viewer", slack: "in Slack" };
  const STATUS = { triage: "Checking", variants: "Drawing options", feedback: "Options ready", prototype: "Building prototype", testing: "Live — try it", spec: "Writing the spec", "handed-off": "Sent to developers", declined: "Closed" };
  const FIDELITY = { wireframe: "sketch", mockup: "looks like the product", figma: "from Figma" };
  const TYPE = { feature: "From a GitHub issue", adjustment: "Touch-up of a developer's change", proposal: "Suggested by Design Desk" };
  const WORK = {
    request: "Checking your request: how this screen works today, whether anyone is already changing it, and what can be done as a design change.",
    "follow-up": "Checking your request: how this screen works today, whether anyone is already changing it, and what can be done as a design change.",
    explore: "Drawing two or three design options.",
    revise: "Changing the design as you asked.",
    build: "Building the live prototype: a private copy of the product with this design. The first one can take up to an hour; you can close this page.",
    handoff: "Writing the developer spec and sending it on.",
    teardown: "Switching off the live prototype.",
    figma: "Working with Figma.",
    agenda: "Writing a short brief for the next call.",
    catalog: "Drawing every state of this element.",
    screens: "Checking the screenshots that were added and writing their captions.",
    slack: "Posting the options to Slack for votes and comments.",
  };
  const HANDOFF_TO = {
    "coding-agent": "the coding agent, which builds it into the product",
    "issue-comment": "the GitHub issue it came from, where a developer picks it up",
    issue: "a new GitHub issue for the developers",
    "draft-pr": "a draft change on GitHub for the developers",
    desk: "nobody yet: it stays here on the Desk",
  };
  const VERDICT = {
    idea: {
      design: ["Design only", "I can draw design options and build a live prototype of the one you choose."],
      "needs-developer": ["Needs a developer", "I can draw design options that show the whole idea. The parts below need a developer, so this request gets no live prototype; the developer spec lists them."],
      product: ["Needs a decision", "I can sketch it to support the discussion, but it changes what the product does, so the team decides first."],
    },
    bug: {
      design: ["I can fix how this looks", "It's a visual fault. I'll draw the fix and can build a live prototype of it."],
      "needs-developer": ["A developer needs to fix this", "The screen does the wrong thing, not just looks wrong. The spec gives a developer the steps and screenshots."],
      product: ["This works as designed", "The product does this on purpose; the reason is below. If you think it should change, send it as a suggestion."],
    },
  };
  const RESEARCH = { clear: "Clear to go", duplicate: "Already tracked elsewhere", deliberate: "Today's behaviour was a deliberate decision", collision: "Someone is changing this right now", unclear: "Not enough to go on — Design Desk asked you a question below" };
  const GUIDE = () => `<h2>How Design Desk works</h2>
<p class="lead">Design Desk keeps you up to date with what changes in the product, explains it in plain words, and turns your ideas into design options and live prototypes. It only ever changes how the product <b>looks</b>, never what it <b>does</b>, and it tells you up front what needs a developer.</p>
<ol>
<li><b>New</b> — every change to the product's screens, explained, with screenshots, soon after it ships. Each one says where else the same thing shows up and what the change touches.</li>
<li><b>Requests</b> — describe a problem in your own words. Design Desk checks what can be done, draws two or three options, the team votes and comments, and it builds a live prototype you can click through. Each request says what happens next and whose turn it is.</li>
<li><b>Ask anything</b> on any page: why something works the way it does, what can change, or "show me how it looks when…". The answer appears right below your question, with a picture when it helps.</li>
</ol>
<h3>Changing a design</h3>
<p>Open a request's <b>design workspace</b>. Click any part of a design option to select it — it gets a blue frame — and write what should change, or switch to <b>Edit text</b> and type the new words right in it. Design Desk changes the option and the new version appears in the same place. Every note keeps its number on the design, so it is always clear what was asked where.</p>
<h3>What it cannot do — a developer has to</h3><ul>
<li>Change what the product does: what it saves or loads, its rules and checks, who may do what, how it talks to other systems.</li>
<li>Add a new piece of information the product does not have yet, or remove something a person can do today.</li>
<li>Change anything behind the screens: servers, data, security, settings.</li></ul>
<p>It still sketches such ideas, and the developer spec names the part a developer has to build.</p>
<h3>How long things take</h3><ul>
<li>A question or a small change: usually a few minutes.</li>
<li>Design options: usually well under an hour.</li>
<li>The first live prototype of a request: up to an hour; later updates are faster.</li></ul>
<p>The page updates by itself; you can close it and come back.</p>
<h3>Who can do what</h3><ul>
<li><b>Everyone on the list</b>: read, ask, comment.</li>
<li><b>PMs and developers</b>: also vote, send requests and add things to the next call.</li>
<li><b>Designers</b>: also start options, change them in the workspace, build live prototypes, approve and close.</li></ul>
<p>Your role is shown top right; ${esc(S.me?.contact || "the Desk's owner")} changes it.</p>
<h3>Also here</h3><ul>
<li><b>Next call</b> — things to decide at the team's design meeting, each with a short brief.</li>
<li><b>Product</b> — a map of the product's screens with how to get to each and why it is like it is; its real parts, each shown in every situation it can be in; and every decision the team made, searchable.</li>
<li><b>Weekly digest</b> — under New: what changed in the product's UX this week, the decisions taken, what waits for one, and the themes in people's feedback.</li>
<li><b>Slack</b> — tell Design Desk in the team channel when something looks broken; it puts it here and answers in your thread.</li>
<li><b>Chat</b> — the Desk's owner can do everything here also by talking to Design Desk in its chat.</li></ul>`;

  // ---------- bridge ----------
  const bridge = window.platform;
  // A refusal the server explains is shown as it is; anything else gets one plain line.
  class Said extends Error {}
  async function api(method, path, body) {
    if (!bridge) throw new Said("The Desk can't load here. Open it from the link your team shared with you, and bookmark that link.");
    let res;
    try { res = await bridge.request({ method, path, body: body === undefined ? undefined : JSON.stringify(body), contentType: body === undefined ? undefined : "application/json" }); }
    catch { throw new Error("offline"); }
    let data = {};
    try { data = JSON.parse(res.body || "{}"); } catch { data = {}; }
    if (res.status >= 400 && res.status < 500 && data.error) throw new Said(data.error);
    if (res.status >= 400) throw new Error(`${res.status}`);
    if (data.ping) { try { bridge.sendPrompt(data.ping); } catch {} }
    return data;
  }

  // ---------- state ----------
  const S = { me: null, tab: "new", newFilter: "new", reqFilter: "open", productFilter: "screens", decisionQuery: "", decisions: [], decision: null, cards: [], card: null, variant: null, agenda: [], offline: false, assetCache: new Map(),
    ws: { open: false, mode: "select", selected: null, edit: null, version: null, seen: {} } };
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const safeUrl = (u) => (/^https?:\/\//i.test(String(u || "")) ? esc(u) : "#");
  const myKey = () => S.me?.key || S.me?.email || "";
  const can = (a) => Boolean(S.me?.can?.[a]);
  const contact = () => S.me?.contact || "the Desk's owner";
  const when = (iso) => { if (!iso) return ""; const d = new Date(iso); return d.toLocaleString("en", { dateStyle: "medium", timeStyle: "short" }); };
  const day = (iso) => (iso ? new Date(iso).toLocaleDateString("en", { dateStyle: "medium" }) : "");
  const toast = (msg) => { const el = document.createElement("div"); el.className = "toast"; el.textContent = msg; document.body.append(el); setTimeout(() => el.remove(), 4800); };
  const fail = (e) => toast(e instanceof Said ? e.message : `Something went wrong. Try again; if it keeps happening, tell ${contact()}.`);
  const guard = (fn) => async (...a) => { try { await fn(...a); } catch (e) { fail(e); } };
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

  // Markdown-lite: escaped first, then a few safe constructs; links only http(s).
  function md(src) {
    const inline = (s) => esc(s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
      .replace(/!\[([^\]]*)\]\(asset:(A-\d+)\)/g, '<figure class="shot" style="max-width:520px;margin:6px 0" data-zoom="$2"><img alt="$1" data-asset="$2" /><figcaption>$1</figcaption></figure>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    const out = []; let list = null;
    for (const line of String(src || "").split("\n")) {
      const li = line.match(/^\s*[-*] (.*)$/);
      if (li) { if (!list) { list = []; } list.push(`<li>${inline(li[1])}</li>`); continue; }
      if (list) { out.push(`<ul>${list.join("")}</ul>`); list = null; }
      const h = line.match(/^#{1,4} (.*)$/);
      if (h) out.push(`<h4>${inline(h[1])}</h4>`);
      else if (line.trim()) out.push(`<p>${inline(line)}</p>`);
    }
    if (list) out.push(`<ul>${list.join("")}</ul>`);
    return `<div class="md">${out.join("")}</div>`;
  }

  const roleName = (r) => ROLE[r] || r;
  const who = (by) => by?.agent ? "<b>Design Desk</b>"
    : by?.via === "slack" ? `<b>${esc(by.name || by.email || "someone")}</b> · via Slack${by.role && by.role !== "slack" ? ` · ${esc(roleName(by.role))}` : ""}`
    : `<b>${esc(by?.email && by.email === S.me?.email ? "you" : (by?.email || "someone"))}</b> · ${esc(roleName(by?.role))}`;
  const typeOf = (c) => (c.request?.type === "bug" ? "bug" : "idea");
  const closed = (c) => c.status === "handed-off" || c.status === "declined";
  const working = (c) => [...new Set((c.waiting || []).map((w) => w.kind).filter((k) => k !== "question"))];
  const optionName = (c, id) => (c.variants || []).find((v) => v.id === id)?.name || "an option";

  // The option designers like most; none on a tie, the only one when there is one.
  function favourite(c) {
    const vs = c.variants || [];
    if (vs.length === 1) return vs[0];
    const score = (v) => Object.values(c.votes?.[v.id] || {}).filter((x) => x.vote === "prefer" && ["designer", "lead"].includes(x.role)).length;
    const s = [...vs].sort((a, b) => score(b) - score(a));
    return s.length && score(s[0]) > 0 && score(s[0]) > score(s[1] || { id: "" }) ? s[0] : null;
  }

  // ---------- dialogs ----------
  // A form never submits here (docs/desk.md → Where it works): a dialog's buttons check
  // the fields and close it, and its "close" handler does the work.
  document.addEventListener("click", (e) => {
    const b = e.target.closest("dialog [data-close]");
    if (!b) return;
    const dlg = b.closest("dialog");
    if (b.dataset.close !== "cancel" && !dlg.querySelector("form").reportValidity()) return;
    dlg.close(b.dataset.close);
  });
  // A confirmation for anything that cannot be taken back; optional choice, note or link.
  function ask({ title, body, ok, choices = null, pick = null, note = null, url = null }) {
    const dlg = $("#confirm-dialog"), f = $("#confirm-form");
    f.reset();
    $("#cf-title").textContent = title;
    $("#cf-body").innerHTML = body ? md(body) : "";
    $("#cf-ok").textContent = ok;
    $("#cf-choices").innerHTML = choices ? choices.map((c) => `<label><input type="radio" name="choice" value="${esc(c.id)}" ${c.id === pick ? "checked" : ""} required /> ${esc(c.name)}${c.hint ? ` <span class="sub">${esc(c.hint)}</span>` : ""}</label>`).join("") : "";
    $("#cf-note-wrap").hidden = !note; $("#cf-note-label").textContent = note || "";
    $("#cf-url-wrap").hidden = !url; $("#cf-url-label").textContent = url || ""; f.url.required = Boolean(url);
    dlg.returnValue = ""; dlg.showModal();
    return new Promise((resolve) => {
      dlg.onclose = () => resolve(dlg.returnValue === "ok" ? { choice: f.querySelector("input[name=choice]:checked")?.value || null, note: f.note.value.trim(), url: f.url.value.trim() } : null);
    });
  }

  // ---------- header and list ----------
  function renderNav() {
    const unseen = S.cards.filter((c) => (c.kind === "change" || c.kind === "digest") && !c.acked).length;
    const asks = S.cards.filter((c) => c.kind === "request" && c.asks && !closed(c)).length;
    const tabs = [["new", "New", unseen], ["requests", "Requests", asks], ["call", "Next call", S.agenda.length], ["product", "Product"], ["guide", "How it works"]];
    $("#nav").innerHTML = tabs.map(([k, label, n]) => `<button data-tab="${k}" aria-current="${S.tab === k}">${esc(label)}${n ? `<span class="count">${n}</span>` : ""}</button>`).join("");
  }

  function renderBanners() {
    const out = [];
    if (S.offline) out.push(`<div class="banner warn">Can't reach Design Desk right now. Retrying…</div>`);
    if (S.me?.role === "guest") out.push(`<div class="banner">You can read, ask and comment. To vote or send requests, ask ${esc(contact())} to add ${esc(S.me.email || "you")} as a designer, PM or developer.</div>`);
    $("#banners").innerHTML = out.join("");
  }

  function visibleCards() {
    if (S.tab === "new") return S.cards.filter((c) => (c.kind === "change" || c.kind === "digest") && (S.newFilter === "all" || !c.acked));
    if (S.tab === "product" && S.productFilter !== "decisions") {
      const kind = S.productFilter === "elements" ? "element" : "screen";
      return S.cards.filter((c) => c.kind === kind).sort((a, b) => (a.group || "").localeCompare(b.group || "") || a.title.localeCompare(b.title));
    }
    if (S.tab === "requests") return S.cards.filter((c) => c.kind === "request" && (S.reqFilter === "open" ? !closed(c) : closed(c)));
    return [];
  }

  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  function chipsFor(c) {
    const out = [];
    if (c.kind === "digest") out.push(`<span class="chip info">Weekly digest</span>`);
    else if (c.kind === "screen") {
      if (c.group) out.push(`<span class="chip">${esc(c.group)}</span>`);
      if (c.path) out.push(`<span class="chip"><code>${esc(c.path)}</code></span>`);
    } else if (c.kind === "element") {
      if (c.group) out.push(`<span class="chip">${esc(c.group)}</span>`);
      if (c.status === "stale") out.push(`<span class="chip warn">out of date</span>`);
      else if (c.state_count) out.push(`<span class="chip">${plural(c.state_count, "situation", "situations")}</span>`);
    } else if (c.kind === "change") {
      if (c.in_progress) out.push(`<span class="chip warn">In progress — not shipped yet</span>`);
      if (c.acked) out.push(`<span class="chip ok">✓ Seen</span>`);
      if (c.open_threads) out.push(`<span class="chip">${plural(c.open_threads, "open question", "open questions")}</span>`);
    } else {
      if (c.automated) out.push(`<span class="chip info">🧪 From automated tests</span>`);
      if (c.asks && !closed(c)) out.push(`<span class="chip warn">Waiting for your answer</span>`);
      else out.push(`<span class="chip ${c.busy ? "info" : ""}">${c.busy ? "● " : ""}${esc(STATUS[c.status] || c.status)}</span>`);
      if (c.type === "bug") out.push(`<span class="chip bad">🐛 Broken</span>`);
      else if (c.triage) out.push(`<span class="chip ${c.triage === "design" ? "ok" : "warn"}">${esc(VERDICT.idea[c.triage]?.[0] || "")}</span>`);
    }
    return out.join("");
  }

  function renderList() {
    const list = $("#list");
    const main = $("#main");
    main.classList.toggle("wide", S.tab === "guide");
    if (S.tab === "guide") { list.innerHTML = ""; return; }
    if (S.tab === "call") { renderAgendaList(); return; }
    const cards = visibleCards();
    const f = (key, opts) => `<div class="filters">${opts.map(([k, l]) => `<button class="btn small ${S[key] === k ? "on" : ""}" data-filter="${key}:${k}">${esc(l)}</button>`).join("")}</div>`;
    const filters = S.tab === "new" ? f("newFilter", [["new", "Not seen yet"], ["all", "All"]]) : S.tab === "requests" ? f("reqFilter", [["open", "Open"], ["closed", "Closed"]])
      : S.tab === "product" ? f("productFilter", [["screens", "Screens"], ["elements", "Elements"], ["decisions", "Decisions"]]) : "";
    if (S.tab === "product" && S.productFilter === "decisions") { renderDecisionList(filters); return; }
    const empty = {
      new: S.newFilter === "new" ? "Nothing new. Changes to the product's screens appear here soon after they ship." : "No changes yet. They appear here soon after they ship.",
      requests: S.reqFilter === "open" ? (can("request") ? "No open requests. Press New request to describe what you would change." : "No open requests.") : "No closed requests.",
      product: S.productFilter === "elements" ? "No elements yet. Design Desk draws the product's main parts after it is set up; they appear here within a day."
        : "No screens yet. Design Desk maps the product's screens on its own copy of the product; they appear here once it runs.",
    }[S.tab];
    if (!cards.length) { list.innerHTML = filters + `<div class="empty">${esc(empty)}</div>`; return; }
    list.innerHTML = filters + cards.map((c) => `<button class="row" data-card="${esc(c.id)}" aria-current="${S.card?.id === c.id}">
      <div class="t">${c.kind === "change" && !c.acked ? '<span class="dot"></span>' : ""}<span>${esc(c.title)}</span></div>
      ${c.summary ? `<div class="s">${esc(c.summary)}</div>` : ""}
      <div class="meta">${chipsFor(c)}</div></button>`).join("");
  }

  // ---------- decisions ----------
  function renderDecisionList(filters) {
    const list = $("#list");
    const rows = S.decisions.map((d) => `<button class="row" data-decision="${esc(d.id)}" aria-current="${S.decision?.id === d.id}"><div class="t"><span>${esc(d.text)}</span></div>
      <div class="meta"><span class="chip">${esc(day(d.at))}</span>${d.concepts.slice(0, 3).map((x) => `<span class="chip">${esc(x)}</span>`).join("")}</div></button>`).join("");
    list.innerHTML = `${filters}<input id="decision-q" placeholder="Search decisions…" value="${esc(S.decisionQuery)}" style="margin-bottom:10px" />${rows || `<div class="empty">${S.decisionQuery ? "No decision matches." : "No decisions recorded yet. Approved designs, outcomes of the next call and deliberate behaviour Design Desk finds land here."}</div>`}`;
  }
  async function loadDecisions() {
    try { S.decisions = (await api("GET", `/api/decisions?q=${encodeURIComponent(S.decisionQuery)}`)).decisions || []; } catch { S.decisions = []; }
  }
  function renderDecision(d) {
    return `<button class="btn small back" data-back>← Back</button><h2>${esc(d.text)}</h2>
      <div class="sub"><span>${esc(day(d.at))}</span>${d.concepts.map((x) => `<span class="chip">${esc(x)}</span>`).join("")}</div>
      ${d.why ? `<h3>Why</h3>${md(d.why)}` : ""}
      ${d.source ? `<h3>Where it was decided</h3><p>${srcLink(d.source) || "—"}</p>` : ""}`;
  }

  // ---------- the next call ----------
  function renderAgendaList() {
    const items = S.agenda;
    $("#list").innerHTML = items.length ? items.map((a, i) => `<button class="row" data-card="${esc(a.id)}"><div class="t"><span>${i + 1}. ${esc(a.title)}</span></div>
      <div class="s">${esc(a.agenda.brief || "Design Desk is writing a short brief.")}</div><div class="meta"><span class="chip">added by ${esc(a.agenda.by?.email || "Design Desk")}</span></div></button>`).join("")
      : `<div class="empty">The next call is the team's regular design meeting. To put something on it, open it and choose Add to the next call.</div>`;
  }
  function renderAgendaDetail() {
    const items = S.agenda;
    $("#detail").innerHTML = `<h2>Next call</h2><p class="hint">What the team decides at its next design meeting. Present it from here.</p>
      <div class="actions">${items.length ? `<button class="btn primary" data-present="0">▶ Present</button>` : ""}${can("close") && items.length ? `<button class="btn" data-act="clear-call">Call is over — clear the list</button>` : ""}</div>
      ${items.map((a, i) => `<div class="section"><h4>${i + 1}. ${esc(a.title)}</h4>${a.agenda.note ? `<p class="sub">“${esc(a.agenda.note)}” — ${esc(a.agenda.by?.email || "Design Desk")}</p>` : ""}<b>What we decide</b>${md(a.agenda.brief || "Design Desk is writing a short brief.")}</div>`).join("") || `<div class="empty">Nothing is on the next call yet.</div>`}`;
  }

  // Presenting: one item at a time, full screen; arrows or the buttons move.
  async function present(i = 0) {
    const items = S.agenda;
    if (!items.length) return;
    const n = Math.max(0, Math.min(i, items.length - 1));
    const { card } = await api("GET", `/api/cards/${encodeURIComponent(items[n].id)}`);
    let ov = $("#present");
    if (!ov) { ov = document.createElement("div"); ov.id = "present"; ov.style.cssText = "position:fixed;inset:0;z-index:75;background:var(--bg);overflow:auto;padding:28px 48px"; document.body.append(ov); }
    const fav = favourite(card) || card.variants?.[0];
    const visual = card.kind === "element" && card.sheet ? card.sheet : fav?.asset || card.screens?.[0]?.asset || null;
    ov.dataset.index = String(n);
    ov.innerHTML = `<div class="sub" style="justify-content:space-between"><span>${n + 1} / ${items.length} · Next call</span><span><button class="btn small" data-present="${n - 1}" ${n === 0 ? "disabled" : ""}>← Previous</button> <button class="btn small" data-present="${n + 1}" ${n === items.length - 1 ? "disabled" : ""}>Next →</button> <button class="btn small" data-exit-present>Exit</button></span></div>
      <h2 style="font-size:28px;margin-top:12px">${esc(card.title)}</h2>${card.summary ? `<p class="lead">${esc(card.summary)}</p>` : ""}
      <div class="panel" style="max-width:90ch"><b>What we decide</b>${md(card.agenda?.brief || "Design Desk is writing a short brief.")}</div>
      ${fav && (card.variants || []).length > 1 ? `<p class="sub" style="margin-top:12px">Showing the favourite: <b>${esc(fav.name)}</b> · options: ${card.variants.map((v) => esc(v.name)).join(" · ")}</p>` : ""}
      ${visual ? `<iframe class="frame" id="present-frame" sandbox="allow-scripts" style="height:60vh;margin-top:16px"></iframe>` : ""}`;
    if (visual) {
      const a = await asset(visual);
      $("#present-frame").srcdoc = a.contentType.startsWith("image/") ? `<img src="${dataUrl(a)}" style="max-width:100%">` : decode(a);
    }
  }

  // ---------- assets ----------
  async function asset(id) {
    if (S.assetCache.has(id)) return S.assetCache.get(id);
    const a = await api("GET", `/api/assets/${encodeURIComponent(id)}`);
    if (S.assetCache.size > 40) S.assetCache.delete(S.assetCache.keys().next().value);
    S.assetCache.set(id, a);
    return a;
  }
  const dataUrl = (a) => a.encoding === "base64" ? `data:${a.contentType};base64,${a.data}` : `data:${a.contentType};charset=utf-8,${encodeURIComponent(a.data)}`;
  const decode = (a) => (a.encoding === "base64" ? new TextDecoder().decode(Uint8Array.from(atob(a.data), (ch) => ch.charCodeAt(0))) : a.data);

  // ---------- shared pieces of a page ----------
  const FROM = { pr: "from the pull request", instance: "from Design Desk's copy of the product", prototype: "from the live prototype", rebuild: "drawn from the code, not a real screen", test: "from an automated test" };
  const fromOf = (s) => s.source === "person" ? `added by ${s.by?.email && s.by.email === S.me?.email ? "you" : (s.by?.email || "someone")}` : FROM[s.source] || "";
  const figure = (s, label) => `<figure class="shot" data-zoom="${esc(s.asset)}"><img alt="${esc(s.caption)}" data-asset="${esc(s.asset)}" />${label || s.caption || fromOf(s) ? `<figcaption>${label ? `<b>${esc(label)}</b> ` : ""}${esc(s.caption)}${fromOf(s) ? `<span class="hint" style="display:block;margin:0">${esc(fromOf(s))}</span>` : ""}</figcaption>` : ""}</figure>`;
  // Before and after of one screen sit side by side, with the differences drawn on the third.
  function shots(list) {
    list = list || [];
    if (!list.length) return "";
    const pairs = [...new Set(list.filter((x) => x.stage).map((x) => x.pair))];
    const rows = pairs.map((pair) => {
      const of = (stage) => list.find((x) => x.pair === pair && x.stage === stage);
      return `<h4 style="margin:12px 0 6px">${esc(pair)}</h4><div class="shots">${[["before", "Before"], ["after", "After"], ["diff", "What changed"]].map(([st, l]) => of(st) ? figure(of(st), l) : "").join("")}</div>`;
    }).join("");
    const single = list.filter((x) => !x.stage);
    return rows + (single.length ? `<div class="shots" style="margin-top:${rows ? 12 : 0}px">${single.map((x) => figure(x)).join("")}</div>` : "");
  }

  // The agent's own install of the product: where people try a change and take pictures.
  function renderInstance(c) {
    const i = c.instance, list = c.shotlist || [];
    if (!i && !list.length) return "";
    const link = (path) => i?.url ? `${i.url.replace(/\/$/, "")}${path || ""}` : "";
    return `<div class="panel" style="max-width:80ch;margin-top:12px">
      ${i ? `<b>Try it yourself</b><p class="hint">Design Desk runs its own copy of the product${i.ref ? ` at ${esc(i.ref)}` : ""}${i.commit ? ` (${esc(i.commit.slice(0, 7))})` : ""}, with made-up data. Sign in with the demo account below, not your own.</p>
        <div class="actions"><a class="btn primary" href="${safeUrl(i.url)}" target="_blank" rel="noopener noreferrer">Open the product ↗</a>${can("screens") ? `<button class="btn" data-add-shots>Add screenshots</button>` : ""}</div>
        ${i.login ? `<dl class="kv"><dt>Demo account</dt><dd><code>${esc(i.login.user || "")}</code>${i.login.password ? ` / <code>${esc(i.login.password)}</code>` : ""}${i.login.hint ? ` <span class="sub">${esc(i.login.hint)}</span>` : ""}</dd></dl>` : ""}` : ""}
      ${list.length ? `<p style="margin:12px 0 4px"><b>What to capture</b></p><ol class="md" style="padding-left:20px;margin:0">${list.map((x) => `<li><b>${esc(x.name)}</b>${x.how ? ` — ${esc(x.how)}` : ""}${x.path && i?.url ? ` <a href="${safeUrl(link(x.path))}" target="_blank" rel="noopener noreferrer">open ↗</a>` : ""}</li>`).join("")}</ol>` : ""}
    </div>`;
  }
  const sections = (c) => (c.sections || []).map((s) => `<div class="section"><h4>${esc(s.title)}</h4>${md(s.body)}</div>`).join("");
  const srcLink = (s) => !s ? "" : s.url ? ` <a href="${safeUrl(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.label || "source")} ↗</a>` : s.card ? ` <button class="anchor" data-card="${esc(s.card)}">${esc(s.label || "see it here")}</button>` : s.label ? ` <span class="sub" style="display:inline">(${esc(s.label)})</span>` : "";

  // Where else the same thing shows up, what a change touches, what was decided before.
  function renderImpact(im) {
    if (!im) return "";
    const li = (xs, f) => xs?.length ? `<ul>${xs.map(f).join("")}</ul>` : "";
    return `<h3>Where else this shows up, and what it touches</h3><div class="impact section">
      <p>Everywhere <b>${esc(im.concept)}</b> appears:</p>${li(im.places, (p) => `<li><b>${esc(p.where)}</b>${p.how ? ` — ${esc(p.how)}` : ""}</li>`) || "<p class='hint'>Only here.</p>"}
      ${im.affects?.length ? `<p><b>What a change here touches</b></p>${li(im.affects, (a) => `<li><b>${esc(a.what)}</b>${a.why ? ` — ${esc(a.why)}` : ""}${srcLink(a.source)}</li>`)}` : ""}
      ${im.decisions?.length ? `<p><b>Earlier decisions about it</b></p>${li(im.decisions, (d) => `<li>${esc(d.text)}${d.when ? ` <span class="sub" style="display:inline">(${esc(day(d.when) || d.when)})</span>` : ""}${srcLink(d.source)}</li>`)}` : ""}</div>`;
  }

  function renderThreads(c, { skipAsks = false } = {}) {
    const threads = (c.threads || []).filter((th) => !(skipAsks && th.kind === "asks" && th.state === "open"));
    const label = { question: ["Question", "info"], comment: ["Comment", ""], concern: ["Concern", "warn"], change: ["Change", "info"], asks: ["Design Desk asks", "warn"] };
    const rows = threads.map((th) => {
      const [name, tone] = label[th.kind] || [th.kind, ""];
      const anchor = th.anchor?.variant ? `<button class="anchor" data-goto="${esc(th.id)}">◎ ${esc(th.anchor.label || th.anchor.text || "an element")} in ${esc(optionName(c, th.anchor.variant))}</button>` : "";
      const state = th.state === "resolved" ? `<span class="chip ok">done</span>` : th.state === "answered" ? `<span class="chip">answered</span>` : "";
      return `<article class="thread" id="th-${esc(th.id)}">
        <div class="head"><span class="chip ${tone}">${esc(name)}</span>${anchor}${state}</div>
        ${th.messages.map((m) => `<div class="msg ${m.by?.agent ? "agent" : ""}"><div class="who">${who(m.by)} · ${esc(when(m.at))}</div>${md(m.text)}</div>`).join("")}
        ${th.needs_agent ? `<div class="msg"><span class="pending">Waiting for Design Desk…</span></div>` : ""}
        ${th.state !== "resolved" ? `<div class="reply"><input placeholder="Reply…" data-reply="${esc(th.id)}" maxlength="4000" /><button class="btn small" data-send-reply="${esc(th.id)}">Reply</button><button class="btn small" data-resolve="${esc(th.id)}" title="Closes this conversation">Mark done</button></div>` : ""}
      </article>`;
    }).join("");
    return `<h3>Questions and comments</h3><div class="threads">${rows}</div>
      <div class="composer" id="composer">
        <textarea id="composer-text" maxlength="4000" placeholder="Ask anything: why it works this way, what could change… or leave a comment for the team."></textarea>
        <div class="bar"><button class="btn primary" data-post="question">Ask Design Desk</button><button class="btn" data-post="comment">Comment for the team</button></div>
        <p class="hint">Design Desk answers questions right here. It reads comments when it changes the design.</p></div>`;
  }

  // ---------- a shipped change ----------
  function renderChange(c) {
    const src = c.source || {};
    const seen = Boolean(c.acks && S.me && c.acks[myKey()]);
    const inProgress = src.pr && !src.merged_at;
    return `<button class="btn small back" data-back>← Back</button>
      <h2>${esc(c.title)}</h2>
      <div class="sub">${inProgress ? `<span class="chip warn">In progress — not shipped yet</span>` : src.merged_at ? `<span>Shipped ${esc(day(src.merged_at))}</span>` : ""}${src.author ? `<span>by ${esc(src.author)}</span>` : ""}</div>
      ${inProgress ? `<p class="hint">A developer is building this now. To make it look different before it ships, choose Adjust the design.</p>` : ""}
      ${c.summary ? `<p class="lead">${esc(c.summary)}</p>` : ""}
      <div class="actions">
        <button class="btn ${seen ? "" : "primary"}" data-ack ${seen ? "disabled" : ""} title="Hides it from your list of new changes; nobody else is told">${seen ? "✓ Seen" : "Got it"}</button>
        <button class="btn" data-focus-composer>Ask a question</button>
        ${can("follow-up") ? `<button class="btn" data-adjust>Adjust the design</button>` : ""}
        ${agendaButton(c)}
      </div>
      ${working(c).map((k) => `<div class="working" style="max-width:80ch"><span class="spin"></span><div>${esc(WORK[k] || "Design Desk is working on this.")} <span class="hint">This page updates by itself.</span></div></div>`).join("")}
      <h3>Screens</h3>${(c.screens || []).length ? shots(c.screens) : `<p class="hint">No screenshots yet.${can("screens") && !c.instance ? " Have one? Add it." : ""}</p>`}
      ${!c.instance && can("screens") ? `<div class="actions"><button class="btn" data-add-shots>Add screenshots</button></div>` : ""}
      ${renderInstance(c)}
      ${(c.sections || []).length ? `<h3>What changed and why</h3>${sections(c)}` : ""}
      ${renderImpact(c.impact)}
      ${src.url ? `<p class="hint"><a href="${safeUrl(src.url)}" target="_blank" rel="noopener noreferrer">See it on GitHub ↗</a></p>` : ""}
      ${renderThreads(c)}`;
  }

  // ---------- a screen of the product ----------
  function renderScreen(c) {
    const els = (c.elements || []).map((id) => S.cards.find((x) => x.id === id)).filter(Boolean);
    const changes = (c.changes || []).map((id) => S.cards.find((x) => x.id === id)).filter(Boolean);
    const open = c.instance?.url && c.path ? `${c.instance.url.replace(/\/$/, "")}${c.path}` : null;
    return `<button class="btn small back" data-back>← Back</button>
      <h2>${esc(c.title)}</h2>
      <div class="sub">${c.group ? `<span class="chip">${esc(c.group)}</span>` : ""}${c.path ? `<code>${esc(c.path)}</code>` : ""}${c.status === "stale" ? `<span class="chip warn">changed since these pictures</span>` : ""}</div>
      ${c.summary ? `<p class="lead">${esc(c.summary)}</p>` : ""}
      ${c.how ? `<p><b>How to get there:</b> ${esc(c.how)}</p>` : ""}
      <div class="actions">${open ? `<a class="btn" href="${safeUrl(open)}" target="_blank" rel="noopener noreferrer">Open it in Design Desk's copy ↗</a>` : ""}<button class="btn" data-focus-composer>Ask about this screen</button>${agendaButton(c)}</div>
      <h3>Screens</h3>${shots(c.screens) || `<p class="hint">No pictures yet.</p>`}
      ${els.length ? `<h3>Parts on this screen</h3><div class="actions">${els.map((e) => `<button class="anchor" data-card="${esc(e.id)}">${esc(e.title)}</button>`).join("")}</div>` : ""}
      <h3>Why it is like this</h3><div id="timeline" class="section"><p class="hint">Loading the decisions and changes…</p></div>
      ${sections(c)}${renderImpact(c.impact)}
      ${renderThreads(c)}`;
  }
  // Decisions about the screen's concepts and the changes that shaped it, newest first.
  async function loadTimeline(c) {
    const box = $("#timeline");
    if (!box) return;
    const seen = new Map();
    for (const concept of c.concepts || []) {
      try { for (const d of (await api("GET", `/api/decisions?concept=${encodeURIComponent(concept)}`)).decisions || []) seen.set(d.id, d); } catch {}
    }
    const items = [
      ...[...seen.values()].map((d) => ({ at: d.at, html: `<b>Decided:</b> ${esc(d.text)}${d.why ? ` <span class="hint" style="display:inline">— ${esc(d.why)}</span>` : ""}${srcLink(d.source)}` })),
      ...(c.changes || []).map((id) => S.cards.find((x) => x.id === id)).filter(Boolean).map((x) => ({ at: x.source?.merged_at || x.created, html: `<b>Changed:</b> <button class="anchor" data-card="${esc(x.id)}">${esc(x.title)}</button>` })),
    ].sort((a, b) => String(b.at).localeCompare(String(a.at)));
    box.innerHTML = items.length ? `<ul>${items.map((x) => `<li><span class="hint" style="display:inline">${esc(day(x.at))}</span> ${x.html}</li>`).join("")}</ul>` : `<p class="hint">No recorded decisions or changes yet.</p>`;
  }

  function renderDigest(c) {
    const seen = Boolean(c.acks && S.me && c.acks[myKey()]);
    return `<button class="btn small back" data-back>← Back</button>
      <h2>${esc(c.title)}</h2><div class="sub"><span class="chip info">Weekly digest</span>${c.period ? `<span>${esc(c.period)}</span>` : ""}</div>
      ${c.summary ? `<p class="lead">${esc(c.summary)}</p>` : ""}
      <div class="actions"><button class="btn ${seen ? "" : "primary"}" data-ack ${seen ? "disabled" : ""}>${seen ? "✓ Seen" : "Got it"}</button>${agendaButton(c)}</div>
      ${shots(c.screens)}${sections(c)}
      ${renderThreads(c)}`;
  }

  // ---------- a catalog element ----------
  function renderElement(c) {
    const src = c.source || {};
    return `<button class="btn small back" data-back>← Back</button>
      <h2>${esc(c.title)}</h2>
      <div class="sub">${c.group ? `<span class="chip">${esc(c.group)}</span>` : ""}${c.status === "stale" ? `<span class="chip warn">out of date: the product changed since it was drawn</span>` : ""}</div>
      ${c.summary ? `<p class="lead">${esc(c.summary)}</p>` : ""}
      <div class="actions">${can("refresh") ? `<button class="btn" data-act="refresh">Update the drawing</button>` : ""}${agendaButton(c)}</div>
      ${(c.states || []).length ? `<h3>Situations</h3><ol class="md" style="max-width:80ch;padding-left:20px">${c.states.map((x) => `<li><b>${esc(x.name)}</b>${x.how ? ` — <span class="sub" style="display:inline">${esc(x.how)}</span>` : ""}</li>`).join("")}</ol>` : ""}
      <p class="hint">Each tile is the real element, shown in one situation.</p>
      ${c.sheet ? `<iframe class="frame" id="sheet-frame" sandbox="allow-scripts" title="${esc(c.title)}" style="height:80vh"></iframe>` : `<div class="panel hint">${working(c).length ? "Design Desk is drawing it." : "Not drawn yet."}</div>`}
      ${sections(c)}${renderImpact(c.impact)}
      ${src.file ? `<details class="fold"><summary>For developers</summary><p class="sub"><code>${esc(src.file)}</code>${src.export ? ` · <code>${esc(src.export)}</code>` : ""}${src.commit ? ` · ${esc(src.commit)}` : ""}</p></details>` : ""}
      ${renderThreads(c)}`;
  }

  // ---------- a request ----------
  function renderSteps(c) {
    if (c.status === "declined") return `<div class="steps"><span class="chip bad">Closed</span></div>`;
    const v = c.triage?.verdict;
    const steps = [["check", "Checking"], ["options", "Design options"], ["feedback", "Team feedback"], ...(v && v !== "design" ? [] : [["live", "Try it live"]]), ["sent", "Sent to developers"]];
    const at = { triage: "check", variants: "options", feedback: "feedback", prototype: "live", testing: "live", spec: "sent", "handed-off": "sent" }[c.status];
    let i = steps.findIndex(([k]) => k === at);
    if (c.status === "handed-off") i = steps.length;
    return `<div class="steps">${steps.map(([, l], n) => `<span class="step ${n < i ? "done" : n === i ? "now" : ""}"><span class="n">${n < i ? "✓" : n + 1}</span>${esc(l)}</span>`).join("")}</div>`;
  }

  function agendaButton(c) {
    if (c.agenda?.status === "queued") {
      const mine = c.agenda.by?.email && c.agenda.by.email === S.me?.email;
      return `<span class="chip info">📅 On the next call</span>${mine || can("close") ? `<button class="btn small" data-act="unqueue">Take off the call</button>` : ""}`;
    }
    return can("queue") ? `<button class="btn" data-act="queue">📅 Add to the next call</button>` : "";
  }

  // What happens next, whose turn it is, and the one button that moves it on.
  function nextFor(c) {
    const p = c.prototype || { state: "none" };
    const busy = working(c);
    const design = c.triage?.verdict === "design";
    const hasOptions = (c.variants || []).length > 0;
    const b = (act, label, primary = false) => `<button class="btn ${primary ? "primary" : ""}" data-act="${act}">${esc(label)}</button>`;
    if (c.status === "declined") return { text: "This request is closed.", sub: can("reopen") ? "" : "To bring it back, say so in a comment; a designer reopens it.", buttons: can("reopen") ? b("reopen", "Reopen") : "" };
    if (c.status === "handed-off") return { text: `Sent to developers${c.updated ? ` on ${day(c.updated)}` : ""}.`, sub: "When it ships, it appears under New.", buttons: "" };
    if (busy.length) return { text: "", buttons: hasOptions ? b("workspace", "Open the design workspace") : "" };
    if (c.status === "triage" && !c.triage) return { text: "Design Desk will check this soon.", buttons: "" };
    if (c.status === "triage") return can("explore") ? { text: "Your turn: start the design options.", buttons: b("explore", "Draw design options", true) } : { text: "Next: a designer starts the design options.", buttons: "" };
    if (c.status === "spec") return { text: "", buttons: "" };
    if (["prototype", "testing"].includes(c.status) && ["failed", "expired", "torn-down"].includes(p.state)) {
      const failed = p.state === "failed";
      return { text: failed ? "This try didn't work." : `This prototype was switched off${p.expires ? ` on ${day(p.expires)}` : ""} to free its place.`,
        sub: failed ? "Design Desk wrote why in the comments below." : "", buttons: (design && can("build") ? b("build", failed ? "Try again" : "Build it again", true) : "") + (can("approve") ? b("approve", "Approve…") : "") };
    }
    if (c.status === "testing" || (c.status === "prototype" && p.state === "live")) {
      return { text: "Your turn: try the live prototype and comment below.", sub: can("approve") ? "When the team is happy, approve it." : "A designer approves it when the team is happy.",
        buttons: (can("approve") ? b("approve", "Approve…", true) : "") + (hasOptions ? b("workspace", "Open the design workspace") : "") };
    }
    if (["variants", "feedback"].includes(c.status) && hasOptions) {
      const shaper = can("revise");
      return { text: "Your turn: look at the options, 👍 the one you like or ⚠ what worries you, and comment on any part.",
        sub: shaper ? "Then change details in the design workspace, build a live prototype, or approve one." : "A designer then changes the details, builds a live prototype or approves one.",
        buttons: b("workspace", shaper ? "Open the design workspace" : "Comment on the design", true) + (design && can("build") ? b("build", "Build a live prototype…") : "") + (can("approve") ? b("approve", "Approve…") : "") };
    }
    return { text: "", buttons: "" };
  }

  function renderStatus(c) {
    const busy = working(c);
    const asks = (c.threads || []).filter((th) => th.kind === "asks" && th.state === "open");
    const guestSlow = S.me?.role === "guest" ? " It may take up to 10 minutes to start." : "";
    const nx = nextFor(c);
    const more = closed(c) ? "" : `<details class="more"><summary class="btn">More ▾</summary><div class="menu">${c.agenda?.status === "queued" ? "" : can("queue") ? `<button class="btn" data-act="queue">📅 Add to the next call</button>` : ""}${can("revise") && (c.variants || []).length ? `<button class="btn" data-act="revise">Redraw the options with all comments</button>` : ""}${can("close") ? `<button class="btn" data-act="close">Close this request…</button>` : ""}</div></details>`;
    return `<div class="status">
      ${asks.map((th) => `<div class="asks"><b>Design Desk needs one answer from you before it can go on.</b>${md(th.messages[th.messages.length - 1].text)}
        <div class="reply"><input placeholder="Your answer…" data-reply="${esc(th.id)}" maxlength="4000" /><button class="btn small primary" data-send-reply="${esc(th.id)}">Answer</button></div></div>`).join("")}
      ${busy.map((k) => `<div class="working"><span class="spin"></span><div>${esc(WORK[k] || "Design Desk is working on this.")}${guestSlow} <span class="hint">This page updates by itself.</span></div></div>`).join("")}
      ${nx.text || nx.buttons ? `<div class="next">${nx.text ? `<b>${esc(nx.text)}</b>` : ""}${nx.sub ? `<span class="hint">${esc(nx.sub)}</span>` : ""}<div class="actions">${nx.buttons}${c.agenda?.status === "queued" ? agendaButton(c) : ""}${more}</div></div>` : ""}
    </div>`;
  }

  function renderVerdict(c) {
    const tr = c.triage;
    if (!tr) return "";
    const [title, text] = VERDICT[typeOf(c)][tr.verdict] || ["", ""];
    const list = (xs) => xs?.length ? `<ul>${xs.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
    return `<h3>What can be done</h3><div class="verdict ${esc(tr.verdict)}"><b>${esc(title)}</b>${esc(text)}${list(tr.reasons)}
      ${(tr.can?.length || tr.cannot?.length) ? `<div class="two"><div><b>As a design change</b>${list(tr.can)}</div><div><b>Needs a developer or a decision, and why</b>${list(tr.cannot)}</div></div>` : ""}</div>`;
  }

  function renderResearch(r) {
    if (!r) return "";
    const tone = r.verdict === "clear" ? "ok" : r.verdict === "unclear" ? "" : "warn";
    return `<details class="fold" ${r.verdict !== "clear" ? "open" : ""}><summary>What's already known: <span class="chip ${tone}">${esc(RESEARCH[r.verdict] || r.verdict)}</span></summary><div class="panel">${md(r.summary)}${(r.links || []).length ? `<ul class="hint" style="margin:6px 0 0 16px;padding:0">${r.links.map((l) => `<li><a href="${safeUrl(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.label)}</a></li>`).join("")}</ul>` : ""}</div></details>`;
  }

  function tallyFor(c, v) {
    const votes = Object.values(c.votes?.[v] || {});
    if (!votes.length) return "";
    const by = (k) => votes.filter((x) => x.vote === k);
    const roles = (xs) => Object.entries(xs.map((x) => roleName(x.role)).reduce((m, r) => (m[r] = (m[r] || 0) + 1, m), {})).map(([r, n]) => `${n} ${r}`).join(", ");
    const chip = (xs, cls, label) => xs.length ? `<span class="chip ${cls}">${label} ${xs.length} · ${esc(roles(xs))}</span>` : "";
    return `<div class="tally">${chip(by("prefer"), "ok", "👍")}${chip(by("concern"), "warn", "⚠")}</div>`;
  }

  function renderOptions(c) {
    const vs = c.variants || [];
    if (!vs.length) return "";
    if (!S.variant || !vs.some((v) => v.id === S.variant)) S.variant = (favourite(c) || vs[0]).id;
    const v = vs.find((x) => x.id === S.variant);
    const mine = c.votes?.[v.id]?.[myKey()]?.vote;
    return `<h3>Design options</h3>
      <div class="tabs">${vs.map((x) => `<button data-variant="${esc(x.id)}" aria-pressed="${x.id === v.id}">${esc(x.name)} <span class="chip">${esc(FIDELITY[x.fidelity] || x.fidelity)}</span>${(x.version || 1) > 1 ? ` <span class="chip">version ${x.version}</span>` : ""}</button>`).join("")}</div>
      ${v.rationale ? `<p class="hint" style="max-width:76ch"><b>When this one wins:</b> ${esc(v.rationale)}</p>` : ""}
      <div class="vbar">
        ${can("vote") ? `<button class="btn small ${mine === "prefer" ? "on" : ""}" data-vote="prefer">👍 I like this one</button><button class="btn small ${mine === "concern" ? "on" : ""}" data-vote="concern">⚠ I have a concern</button>` : ""}
        <button class="btn small" data-act="workspace">Open in the design workspace</button>
        ${v.figma_url ? `<a class="btn small" href="${safeUrl(v.figma_url)}" target="_blank" rel="noopener noreferrer">Open in Figma ↗</a>` : ""}
        ${S.me?.slack && can("share") && !(c.polls || []).some((x) => x.state === "open") && !working(c).includes("slack") ? `<button class="btn small" data-act="slack-share">Share in Slack</button>` : ""}
        ${tallyFor(c, v.id)}
      </div>
      ${renderPolls(c)}
      <iframe class="frame" id="variant-frame" sandbox="allow-scripts" title="${esc(v.name)}"></iframe>`;
  }

  // Votes in Slack: open until their date, then the result.
  function renderPolls(c) {
    const polls = c.polls || [];
    if (!polls.length) return "";
    const slackVotes = Object.values(c.votes || {}).reduce((n, box) => n + Object.values(box).filter((x) => x.via === "slack").length, 0);
    return polls.slice(-2).map((p) => p.state === "open"
      ? `<p class="hint">💬 Voting in Slack until ${esc(when(p.closes))}${slackVotes ? ` · ${plural(slackVotes, "vote", "votes")} from Slack so far` : ""}. Reactions and replies there come to this page.${p.url ? ` <a href="${safeUrl(p.url)}" target="_blank" rel="noopener noreferrer">Open in Slack ↗</a>` : ""}</p>`
      : `<p class="hint">💬 Slack vote closed ${esc(day(p.closed))}${p.result ? `: ${esc(p.result)}` : ""}${p.url ? ` <a href="${safeUrl(p.url)}" target="_blank" rel="noopener noreferrer">Open in Slack ↗</a>` : ""}</p>`).join("");
  }

  function renderPrototype(c) {
    const p = c.prototype || { state: "none" };
    if (p.state === "none") return "";
    const msg = { building: "Building the live prototype…", live: "It's live. Open it and click around.", failed: "This try didn't work.", expired: "This prototype was switched off.", "torn-down": "This prototype was switched off." }[p.state] || p.state;
    const g = p.guard ? `<dt>Look-only check</dt><dd>${p.guard.ok ? `<span class="chip ok">✓ only the look changed</span>` : `<span class="chip warn">Part of this would change what the product does, so it was left out of the prototype. The developer spec lists it.</span>`}</dd>` : "";
    return `<h3>Live prototype</h3><div class="panel proto"><b>${esc(msg)}</b>
      ${p.state === "live" ? `<p class="hint">You may first be asked to sign in with your usual account; then sign in to the product with the demo account below, not your own. Everything in it is made-up data; nothing you do reaches real customers. Can't open it? Ask ${esc(contact())} to add you.</p>` : ""}
      ${p.state === "live" && p.url ? `<div><a class="btn primary" href="${safeUrl(p.url)}" target="_blank" rel="noopener noreferrer">Open the prototype ↗</a></div>` : ""}
      <dl class="kv">${p.login ? `<dt>Demo account</dt><dd><code>${esc(p.login.user || "")}</code>${p.login.password ? ` / <code>${esc(p.login.password)}</code>` : ""}${p.login.hint ? ` <span class="sub">${esc(p.login.hint)}</span>` : ""}</dd>` : ""}
      ${p.expires && p.state === "live" ? `<dt>Available until</dt><dd>${esc(when(p.expires))}</dd>` : ""}${g}</dl></div>`;
  }

  function renderRequest(c) {
    const r = c.request || {};
    const origin = c.origin?.channel === "github" && c.origin.url ? `<a href="${safeUrl(c.origin.url)}" target="_blank" rel="noopener noreferrer">${esc(c.origin.kind === "pr" ? "From a developer's change" : "From a GitHub issue")} ↗</a>` : "";
    return `<button class="btn small back" data-back>← Back</button>
      <h2>${esc(c.title)}</h2>
      <div class="sub">${c.origin?.automated ? `<span class="chip info">🧪 From automated tests</span>` : ""}${r.type === "bug" ? `<span class="chip bad">🐛 Something broken</span>` : TYPE[r.type] ? `<span class="chip">${esc(TYPE[r.type])}</span>` : ""}${c.origin?.automated ? `<span>found by <b>${esc(c.origin.tool || "an automated test")}</b>${c.origin.check ? ` · ${esc(c.origin.check)} check` : ""}${c.origin.severity ? ` · ${esc(c.origin.severity)} severity` : ""}${c.origin.build ? ` · ${esc(c.origin.build)}` : ""}</span>` : c.origin?.reporter ? `<span>reported by <b>${esc(c.origin.reporter)}</b></span>` : `<span>by ${who(c.created_by)}</span>`}<span>${esc(when(c.created))}</span>${origin}</div>
      ${renderSteps(c)}
      ${renderStatus(c)}
      <div class="section">${r.type === "bug" ? `<h4>What happens</h4>` : ""}${md(r.problem)}${r.goal ? `${r.type === "bug" ? "<h4>What should happen</h4>" : ""}${md(r.goal)}` : ""}${r.steps ? `<h4>Steps</h4>${md(r.steps)}` : ""}${r.screen ? `<p class="hint">Screen: ${esc(r.screen)}</p>` : ""}${r.figma ? `<p class="hint"><a href="${safeUrl(r.figma)}" target="_blank" rel="noopener noreferrer">The Figma design ↗</a></p>` : ""}</div>
      ${shots(c.screens)}
      ${renderVerdict(c)}
      ${renderResearch(c.research)}
      ${renderOptions(c)}
      ${renderPrototype(c)}
      ${renderImpact(c.impact)}
      ${c.spec?.asset ? `<details class="fold"><summary>The developer spec</summary><div class="panel" id="spec-body">…</div></details>${c.spec.issue_url ? `<p><a href="${safeUrl(c.spec.issue_url)}" target="_blank" rel="noopener noreferrer">Open the GitHub issue ↗</a></p>` : ""}${c.spec.pr_url ? `<p><a href="${safeUrl(c.spec.pr_url)}" target="_blank" rel="noopener noreferrer">Open the draft change on GitHub ↗</a></p>` : ""}` : ""}
      ${(c.sections || []).length ? `<h3>Details</h3>${sections(c)}` : ""}
      ${renderThreads(c, { skipAsks: true })}`;
  }

  // ---------- the design workspace ----------
  // Runs inside the design's frame (sandboxed, opaque origin): selects and outlines what
  // people click, edits text in place, draws numbered pins for notes, and posts back a
  // CSS path, the text and a plain label.
  function frameScript() {
    let mode = "off", selected = null, hover = null, pins = [], editing = null;
    const layer = document.createElement("div");
    layer.style.cssText = "position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;z-index:2147483647";
    document.documentElement.appendChild(layer);
    const css = (el) => { const p = []; while (el && el.nodeType === 1 && p.length < 7) { let s = el.tagName.toLowerCase(); if (el.id) { p.unshift(s + "#" + el.id); break; } const dv = el.getAttribute("data-view"); if (dv) { p.unshift(s + '[data-view="' + dv + '"]'); break; } const sib = [...(el.parentElement?.children || [])].filter((x) => x.tagName === el.tagName); if (sib.length > 1) s += ":nth-of-type(" + (sib.indexOf(el) + 1) + ")"; p.unshift(s); el = el.parentElement; } return p.join(" > "); };
    const kind = (el) => { const t = el.tagName.toLowerCase(), r = el.getAttribute("role"); if (t === "button" || r === "button") return "Button"; if (t === "a") return "Link"; if (/^h[1-6]$/.test(t)) return "Heading"; if (["input", "textarea", "select"].includes(t)) return "Field"; if (["img", "svg", "path"].includes(t)) return "Image"; if (t === "li") return "List item"; if (t === "label") return "Label"; if (["p", "span", "small", "strong", "em", "b"].includes(t)) return "Text"; if (t === "nav") return "Navigation"; if (t === "header") return "Header"; if (["table", "tr", "td"].includes(t)) return "Table"; return "Area"; };
    const textOf = (el) => (el.innerText || el.getAttribute("aria-label") || el.getAttribute("alt") || el.getAttribute("placeholder") || "").trim().replace(/\s+/g, " ").slice(0, 120);
    const labelOf = (el) => { const t = textOf(el); return kind(el) + (t ? " “" + (t.length > 40 ? t.slice(0, 39) + "…" : t) + "”" : ""); };
    const find = (sel) => { try { return sel ? document.querySelector(sel) : null; } catch { return null; } };
    const box = (el, color, label, solid) => { const r = el.getBoundingClientRect(); if (!r.width && !r.height) return; const d = document.createElement("div"); d.style.cssText = "position:absolute;left:" + (r.left + scrollX - 3) + "px;top:" + (r.top + scrollY - 3) + "px;width:" + (r.width + 6) + "px;height:" + (r.height + 6) + "px;border:2px " + (solid ? "solid " : "dashed ") + color + ";border-radius:5px;box-sizing:border-box"; if (label) { const b = document.createElement("span"); b.textContent = label; b.style.cssText = "position:absolute;left:-2px;top:-21px;background:" + color + ";color:#fff;font:600 11px/19px system-ui,sans-serif;padding:0 7px;border-radius:10px;white-space:nowrap"; d.appendChild(b); } layer.appendChild(d); };
    const draw = () => { layer.textContent = ""; for (const p of pins) { const el = find(p.selector); if (el) box(el, p.state === "done" ? "#1f7a4d" : p.state === "working" ? "#b07400" : "#6b6b66", "#" + p.n, false); } if (hover && mode !== "off" && hover !== selected) box(hover, "#2f5bd3", null, false); if (selected) box(selected, "#2f5bd3", mode === "edit" ? "Editing" : "Selected", true); };
    addEventListener("scroll", draw, true); addEventListener("resize", draw); setInterval(draw, 700);
    addEventListener("message", (e) => { const d = e.data || {}; if (d.type === "desk-mode") { mode = d.mode; hover = null; document.documentElement.style.cursor = mode === "off" ? "" : mode === "edit" ? "text" : "crosshair"; draw(); } if (d.type === "desk-pins") { pins = d.pins || []; draw(); } if (d.type === "desk-select") { selected = find(d.selector); if (selected) selected.scrollIntoView({ block: "center", behavior: "smooth" }); draw(); } });
    addEventListener("mouseover", (e) => { if (mode === "off" || editing) return; hover = e.target; draw(); }, true);
    addEventListener("submit", (e) => { if (mode !== "off") e.preventDefault(); }, true);
    addEventListener("click", (e) => {
      if (mode === "off") return;
      if (editing && editing.contains(e.target)) return;
      e.preventDefault(); e.stopPropagation();
      const el = e.target; selected = el; hover = null; draw();
      parent.postMessage({ type: "desk-picked", selector: css(el), tag: el.tagName.toLowerCase(), text: textOf(el), label: labelOf(el) }, "*");
      if (mode === "edit") startEdit(el);
    }, true);
    function startEdit(el) {
      if (el.children.length > 3 || !textOf(el)) return;
      const before = el.innerText; editing = el;
      el.contentEditable = "plaintext-only"; if (el.contentEditable !== "plaintext-only") el.contentEditable = "true";
      el.focus(); getSelection().selectAllChildren(el);
      const finish = (keep) => { el.contentEditable = "false"; el.removeEventListener("keydown", key); el.removeEventListener("blur", blur); editing = null; const after = el.innerText; if (!keep) { el.innerText = before; return; } if (after.trim() !== before.trim()) parent.postMessage({ type: "desk-edited", selector: css(el), tag: el.tagName.toLowerCase(), label: labelOf(el), from: before.trim().slice(0, 300), to: after.trim().slice(0, 300) }, "*"); };
      const key = (k) => { if (k.key === "Enter" && !k.shiftKey) { k.preventDefault(); finish(true); } if (k.key === "Escape") { k.preventDefault(); finish(false); } };
      const blur = () => finish(true);
      el.addEventListener("keydown", key); el.addEventListener("blur", blur);
    }
  }
  const FRAME_SCRIPT = `<script>(${frameScript.toString()})();<\/script>`;
  const withScript = (html) => (html.includes("</body>") ? html.replace("</body>", `${FRAME_SCRIPT}</body>`) : html + FRAME_SCRIPT);

  // Notes on elements, numbered in the order they were written, across all options.
  function notesOf(c) {
    return (c.threads || []).filter((th) => th.anchor?.variant).map((th, i) => ({ ...th, n: i + 1 }));
  }
  function noteState(c, th) {
    if (th.state === "resolved") return ["done", "Done"];
    const last = th.messages[th.messages.length - 1];
    if (last?.by?.agent) return ["open", "Design Desk replied"];
    if (th.kind === "change" && (c.waiting || []).some((w) => w.kind === "revise" && w.state === "claimed")) return ["working", "Being changed now…"];
    if (th.kind === "change") return ["open", "Waiting for Design Desk"];
    return ["open", th.kind === "question" ? "Question" : "Comment"];
  }

  function wsVariant(c) {
    const vs = c.variants || [];
    if (!S.variant || !vs.some((v) => v.id === S.variant)) S.variant = (favourite(c) || vs[0])?.id;
    return vs.find((v) => v.id === S.variant);
  }

  // The workspace is built once per option and version shown; later renders replace the
  // top bar, the tools and the side panel only, so the design's frame keeps its state.
  function renderWorkspace() {
    const ws = $("#workspace");
    const c = S.card, v = S.ws.open && c ? wsVariant(c) : null;
    if (!v) { S.ws.open = false; S.ws.shown = null; ws.hidden = true; ws.innerHTML = ""; return; }
    const versions = [{ version: v.version || 1, asset: v.asset }, ...(v.history || [])];
    const showing = versions.find((h) => h.version === (S.ws.version || versions[0].version)) || versions[0];
    const key = `${c.id}|${v.id}|${showing.asset}`;
    ws.hidden = false;
    if (S.ws.shown !== key || !$("#ws-frame")) {
      ws.innerHTML = `<div class="ws-top" id="ws-top"></div><div class="ws-body"><div class="ws-stage"><div class="actions" style="margin:0" id="ws-tools"></div>
        <iframe class="frame" id="ws-frame" sandbox="allow-scripts" title="${esc(v.name)}"></iframe></div><aside class="ws-side" id="ws-side"></aside></div>`;
      S.ws.shown = key;
      loadWsFrame(c, v, showing.asset);
    }
    const old = showing.version !== (v.version || 1);
    const shaper = can("change");
    $("#ws-top").innerHTML = `<button class="btn small" data-ws-close>← Back to the request</button>
      <span class="title" title="${esc(c.title)}">${esc(c.title)}</span>
      <div class="tabs" style="margin:0">${(c.variants || []).map((x) => `<button data-ws-variant="${esc(x.id)}" aria-pressed="${x.id === v.id}">${esc(x.name)}</button>`).join("")}</div>
      ${versions.length > 1 ? `<select id="ws-version" style="width:auto">${versions.map((h, i) => `<option value="${h.version}" ${showing.version === h.version ? "selected" : ""}>Version ${h.version}${i === 0 ? " (latest)" : ""}</option>`).join("")}</select>` : ""}
      <span class="grow"></span>
      ${S.me?.figma && can("figma") ? `<button class="btn small" data-act="figma-import">Import from Figma</button><button class="btn small" data-act="figma-export">Send to Figma</button>` : ""}
      ${v.figma_url ? `<a class="btn small" href="${safeUrl(v.figma_url)}" target="_blank" rel="noopener noreferrer">Open in Figma ↗</a>` : ""}`;
    $("#ws-tools").innerHTML = old ? `<span class="chip warn">You are looking at version ${showing.version}. Notes go to the latest version.</span>` : `
